</head>
<body class="min-h-screen flex flex-col font-sans antialiased text-slate-800">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // SVG Icons (Strictly Zero Emojis)
    const ArrowLeftIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
    );

    const CompassIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor" opacity="0.2" />
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
      </svg>
    );


    // Interactive 4D Tesseract Viewer (Replaces the triangle)
    function TesseractViewer() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        // 16 vertices of a 4D Hypercube: (±1, ±1, ±1, ±1)
        const vertices = [];
        for (let i = 0; i < 16; i++) {
          vertices.push([
            (i & 1) ? 1 : -1,
            (i & 2) ? 1 : -1,
            (i & 4) ? 1 : -1,
            (i & 8) ? 1 : -1
          ]);
        }

        // 32 edges connecting vertices that differ by exactly 1 bit
        const edges = [];
        for (let i = 0; i < 16; i++) {
          for (let j = i + 1; j < 16; j++) {
            const diff = i ^ j;
            if ((diff & (diff - 1)) === 0) {
              edges.push([i, j]);
            }
          }
        }

        let angleXW = 0;
        let angleYZ = 0;
        let angleXZ = 0;

        let isDragging = false;
        let lastMousePos = { x: 0, y: 0 };

        const handleMouseDown = (e) => {
          isDragging = true;
          lastMousePos = { x: e.clientX, y: e.clientY };
        };

        const handleMouseMove = (e) => {
          if (!isDragging) return;
          const dx = e.clientX - lastMousePos.x;
          const dy = e.clientY - lastMousePos.y;
          angleXW += dx * 0.01;
          angleYZ += dy * 0.01;
          lastMousePos = { x: e.clientX, y: e.clientY };
        };

        const handleMouseUp = () => { isDragging = false; };

        canvas.addEventListener('mousedown', handleMouseDown);
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);

        // Touch support
        const handleTouchStart = (e) => {
          if (e.touches.length > 0) {
            isDragging = true;
            lastMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          }
        };

        const handleTouchMove = (e) => {
          if (!isDragging || e.touches.length === 0) return;
          const dx = e.touches[0].clientX - lastMousePos.x;
          const dy = e.touches[0].clientY - lastMousePos.y;
          angleXW += dx * 0.01;
          angleYZ += dy * 0.01;
          lastMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        };

        canvas.addEventListener('touchstart', handleTouchStart, { passive: true });
        window.addEventListener('touchmove', handleTouchMove, { passive: true });
        window.addEventListener('touchend', handleMouseUp);

        const render = () => {
          if (!isDragging) {
            angleXW += 0.015;
            angleYZ += 0.010;
            angleXZ += 0.007;
          }

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const cx = canvas.width / 2;
          const cy = canvas.height / 2;
          const scale = Math.min(canvas.width, canvas.height) * 0.28;

          // Projected 2D coordinates
          const projected = [];

          for (let i = 0; i < vertices.length; i++) {
            let [x, y, z, w] = vertices[i];

            // 4D rotation in XW plane
            const cosXW = Math.cos(angleXW), sinXW = Math.sin(angleXW);
            const x1 = x * cosXW - w * sinXW;
            const w1 = x * sinXW + w * cosXW;

            // 4D rotation in YZ plane
            const cosYZ = Math.cos(angleYZ), sinYZ = Math.sin(angleYZ);
            const y1 = y * cosYZ - z * sinYZ;
            const z1 = y * sinYZ + z * cosYZ;

            // 3D rotation in XZ plane
            const cosXZ = Math.cos(angleXZ), sinXZ = Math.sin(angleXZ);
            const x2 = x1 * cosXZ - z1 * sinXZ;
            const z2 = x1 * sinXZ + z1 * cosXZ;

            // Perspective projection 4D -> 3D
            const dist4D = 2.4;
            const proj4D = 1 / (dist4D - w1);
            const x3D = x2 * proj4D;
            const y3D = y1 * proj4D;
            const z3D = z2 * proj4D;

            // Perspective projection 3D -> 2D
            const dist3D = 2.8;
            const proj3D = 1 / (dist3D - z3D);
            const sx = cx + x3D * proj3D * scale;
            const sy = cy + y3D * proj3D * scale;

            projected.push({ x: sx, y: sy, z: z3D, w: w1 });
          }

          const strokeColor = 'rgba(2, 132, 199, 0.8)';
          const innerStroke = 'rgba(56, 189, 248, 0.45)';
          const nodeColor = '#0284c7';

          // Draw Edges
          for (let i = 0; i < edges.length; i++) {
            const [p1Idx, p2Idx] = edges[i];
            const p1 = projected[p1Idx];
            const p2 = projected[p2Idx];

            const avgW = (p1.w + p2.w) / 2;

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = avgW > 0 ? strokeColor : innerStroke;
            ctx.stroke();
          }

          // Draw Vertices
          for (let i = 0; i < projected.length; i++) {
            const p = projected[i];
            const r = Math.max(2, 3.5 + p.w * 1.5);
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fillStyle = nodeColor;
            ctx.fill();
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
          }

          animId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animId);
          canvas.removeEventListener('mousedown', handleMouseDown);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
          canvas.removeEventListener('touchstart', handleTouchStart);
          window.removeEventListener('touchmove', handleTouchMove);
          window.removeEventListener('touchend', handleMouseUp);
        };
      }, []);

      return (
        <div className="w-full max-w-md mx-auto mb-4 flex justify-center items-center">
          <canvas
            ref={canvasRef}
            width={400}
            height={260}
            className="w-72 h-52 sm:w-80 sm:h-60 cursor-grab active:cursor-grabbing select-none"
            title="Trascina con il mouse o il tocco per ruotare l'ipercubo 4D"
          />
        </div>
      );
    }

    // Main 404 Page Component
    function NotFoundPage() {
      return (
        <div className="min-h-screen flex flex-col justify-between text-[#0b192c]">
          {/* HEADER / NAVBAR (Identical to Home) */}
          <header className="bg-white/90 border-b border-sky-200 sticky top-0 z-40 backdrop-blur-md shadow-sm">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              
              {/* LOGO */}
              <a href="/" className="flex items-center space-x-2">
                <span className="text-2xl font-bold text-sky-500 font-serif leading-none select-none">π</span>
                <h1 className="font-extrabold text-xl text-[#0b192c] tracking-tight">geometria</h1>
              </a>

              <div className="flex items-center space-x-1.5 bg-sky-50/80 p-1 rounded-md border border-sky-200">
                <a
                  href="/"
                  className="px-3 py-1.5 rounded-md text-xs font-bold text-sky-900 hover:bg-sky-100 transition-all"
                >
                  Consultazione
                </a>
                <a
                  href="/test"
                  className="px-3 py-1.5 rounded-md text-xs font-bold text-sky-900 hover:bg-sky-100 transition-all"
                >
                  Area Test
                </a>
              </div>
            </div>
          </header>

          {/* Main Error Content */}
          <main className="max-w-2xl w-full mx-auto my-auto py-6 sm:py-8 text-center flex flex-col items-center">
            {/* 4D Tesseract Viewer */}
            <TesseractViewer />

            {/* 404 Headline */}
            <div className="space-y-1.5 mb-6">
              <h1 className="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">
                404 - Pagina non trovata
              </h1>
              <p className="text-xs sm:text-sm text-slate-500 max-w-sm mx-auto leading-relaxed">
                Questa coordinata non appartiene allo spazio cartesiano.
              </p>
            </div>

            {/* Action Buttons */}
            <div className="flex flex-wrap items-center justify-center gap-2.5">
              <a
                href="/"
                className="inline-flex items-center gap-2 px-4 py-2 rounded-xl font-bold text-xs bg-sky-600 text-white hover:bg-sky-700 shadow-sm hover:shadow transition-all duration-200"
              >
                <ArrowLeftIcon className="w-3.5 h-3.5" />
                <span>Home</span>
              </a>
              <a
                href="/test.html"
                className="inline-flex items-center gap-2 px-4 py-2 rounded-xl font-bold text-xs bg-white text-slate-800 hover:bg-slate-50 border border-slate-300 shadow-sm transition-all duration-200"
              >
                <CompassIcon className="w-3.5 h-3.5 text-sky-600" />
                <span>Area Test</span>
              </a>
            </div>
          </main>

          {/* Footer (Consistent and strictly without emojis) */}
          <footer className="mt-8 pb-4 text-center">
            <div className="max-w-4xl mx-auto px-4">
              <div className="border-t border-sky-200/60 pt-6 space-y-1.5 text-[11px] text-slate-500 leading-relaxed font-normal">
                <p>
                  Progettato e programmato con sofferenza da <a href="https://www.instagram.com/ballarik99/#" target="_blank" rel="noopener noreferrer" className="text-sky-600 hover:text-sky-800 hover:underline">BallaRik</a> · Nessun triangolo è stato maltrattato durante lo sviluppo · v1.6.6 — Settembre 2026
                </p>
                <p>
                  © 2026 Geometria — Progetto didattico indipendente, no-profit
                </p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NotFoundPage />);
  </script>
