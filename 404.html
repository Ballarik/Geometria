  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // SVG Icons (Strictly Zero Emojis)
    const ArrowLeftIcon = ({ className = "w-4 h-4" }) => (

        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />

    );

    const SparklesIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.286L13 21l-2.286-6.857L5 12l5.714-2.286L13 3z" />
      </svg>
    );

    const CubeIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
      </svg>
    );

    const CloseIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />

    );

    // Penrose Impossible Triangle SVG Component
    function PenroseTriangle({ onClick, clickCount }) {
      return (
        <div 
          onClick={onClick}
          className="relative inline-block cursor-pointer group select-none transition-transform duration-300 hover:scale-105 active:scale-95"
          title="Triangolo impossibile di Penrose (Clicca per interagire)"
        >
          <div className="absolute inset-0 bg-sky-300/30 blur-2xl rounded-full opacity-60 group-hover:opacity-100 transition-opacity"></div>
          <svg className="w-44 h-44 sm:w-56 sm:h-56 relative z-10 drop-shadow-md animate-float-slow" viewBox="0 0 300 300">
            <defs>
              <linearGradient id="penroseA" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#0284c7" />
                <stop offset="100%" stopColor="#0369a1" />
              </linearGradient>
              <linearGradient id="penroseB" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#38bdf8" />
                <stop offset="100%" stopColor="#0ea5e9" />
              </linearGradient>
              <linearGradient id="penroseC" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#bae6fd" />
                <stop offset="100%" stopColor="#7dd3fc" />
              </linearGradient>
            </defs>

            {/* Penrose Triangle Paths */}
            <polygon points="150,25 260,225 220,225 150,95 105,175 85,140" fill="url(#penroseB)" />
            <polygon points="150,25 85,140 105,175 150,95 220,225 60,225" fill="url(#penroseA)" />
            <polygon points="60,225 260,225 240,260 20,260 150,25 170,60" fill="url(#penroseC)" />

            {/* Subtle Vertex Coordinates */}
            <circle cx="150" cy="25" r="4" fill="#0284c7" className="animate-ping opacity-75" />
            <circle cx="150" cy="25" r="3" fill="#ffffff" />
            <circle cx="260" cy="225" r="3" fill="#ffffff" />
            <circle cx="40" cy="225" r="3" fill="#ffffff" />
          </svg>

          {/* Click Indicator Badge */}
          <div className="mt-2 text-center">
            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold tracking-wider uppercase bg-sky-100 text-sky-800 border border-sky-200 group-hover:bg-sky-200 transition-colors">
              <SparklesIcon className="w-3.5 h-3.5 text-sky-600" />
              {clickCount === 0 ? "Spazio Non Euclideo" : `Curvatura: ${clickCount}/3`}
            </span>
          </div>
        </div>
      );
    }

    // 4D Tesseract Canvas Easter Egg Modal
    function TesseractModal({ isOpen, onClose }) {
      const canvasRef = useRef(null);
      const [speed, setSpeed] = useState(1);

      useEffect(() => {
        if (!isOpen) return;

        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        // 16 vertices of a 4D Hypercube: (±1, ±1, ±1, ±1)
        const vertices = [];
        for (let i = 0; i < 16; i++) {
          vertices.push([
            (i & 1) ? 1 : -1,
            (i & 2) ? 1 : -1,
            (i & 4) ? 1 : -1,
            (i & 8) ? 1 : -1
          ]);
        }

        // 32 edges connecting vertices that differ by exactly 1 bit
        const edges = [];
        for (let i = 0; i < 16; i++) {
          for (let j = i + 1; j < 16; j++) {
            const diff = i ^ j;
            if ((diff & (diff - 1)) === 0) {
              edges.push([i, j]);
            }
          }
        }

        let angleXW = 0;
        let angleYZ = 0;
        let angleXZ = 0;

        let isDragging = false;
        let lastMousePos = { x: 0, y: 0 };

        const handleMouseDown = (e) => {
          isDragging = true;
          lastMousePos = { x: e.clientX, y: e.clientY };
        };

        const handleMouseMove = (e) => {
          if (!isDragging) return;
          const dx = e.clientX - lastMousePos.x;
          const dy = e.clientY - lastMousePos.y;
          angleXW += dx * 0.01;
          angleYZ += dy * 0.01;
          lastMousePos = { x: e.clientX, y: e.clientY };
        };

        const handleMouseUp = () => { isDragging = false; };

        canvas.addEventListener('mousedown', handleMouseDown);
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);

        // Touch support
        const handleTouchStart = (e) => {
          if (e.touches.length > 0) {
            isDragging = true;
            lastMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          }
        };

        const handleTouchMove = (e) => {
          if (!isDragging || e.touches.length === 0) return;
          const dx = e.touches[0].clientX - lastMousePos.x;
          const dy = e.touches[0].clientY - lastMousePos.y;
          angleXW += dx * 0.01;
          angleYZ += dy * 0.01;
          lastMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        };

        canvas.addEventListener('touchstart', handleTouchStart, { passive: true });
        window.addEventListener('touchmove', handleTouchMove, { passive: true });
        window.addEventListener('touchend', handleMouseUp);

        const render = () => {
          if (!isDragging) {
            angleXW += 0.015 * speed;
            angleYZ += 0.010 * speed;
            angleXZ += 0.007 * speed;
          }

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const cx = canvas.width / 2;
          const cy = canvas.height / 2;
          const scale = Math.min(canvas.width, canvas.height) * 0.28;

          // Projected 2D coordinates
          const projected = [];

          for (let i = 0; i < vertices.length; i++) {
            let [x, y, z, w] = vertices[i];

            // 4D rotation in XW plane
            const cosXW = Math.cos(angleXW), sinXW = Math.sin(angleXW);
            const x1 = x * cosXW - w * sinXW;
            const w1 = x * sinXW + w * cosXW;

            // 4D rotation in YZ plane
            const cosYZ = Math.cos(angleYZ), sinYZ = Math.sin(angleYZ);
            const y1 = y * cosYZ - z * sinYZ;
            const z1 = y * sinYZ + z * cosYZ;

            // 3D rotation in XZ plane
            const cosXZ = Math.cos(angleXZ), sinXZ = Math.sin(angleXZ);
            const x2 = x1 * cosXZ - z1 * sinXZ;
            const z2 = x1 * sinXZ + z1 * cosXZ;

            // Perspective projection 4D -> 3D
            const dist4D = 2.4;
            const proj4D = 1 / (dist4D - w1);
            const x3D = x2 * proj4D;
            const y3D = y1 * proj4D;
            const z3D = z2 * proj4D;

            // Perspective projection 3D -> 2D
            const dist3D = 2.8;
            const proj3D = 1 / (dist3D - z3D);
            const sx = cx + x3D * proj3D * scale;
            const sy = cy + y3D * proj3D * scale;

            projected.push({ x: sx, y: sy, z: z3D, w: w1 });
          }

          const strokeColor = 'rgba(2, 132, 199, 0.75)';
          const innerStroke = 'rgba(56, 189, 248, 0.4)';
          const nodeColor = '#0284c7';

          // Draw Edges
          for (let i = 0; i < edges.length; i++) {
            const [p1Idx, p2Idx] = edges[i];
            const p1 = projected[p1Idx];
            const p2 = projected[p2Idx];

            const avgW = (p1.w + p2.w) / 2;

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = avgW > 0 ? strokeColor : innerStroke;
            ctx.stroke();
          }

          // Draw Vertices
          for (let i = 0; i < projected.length; i++) {
            const p = projected[i];
            const r = Math.max(2, 3.5 + p.w * 1.5);
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fillStyle = nodeColor;
            ctx.fill();
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
          }

          animId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animId);
          canvas.removeEventListener('mousedown', handleMouseDown);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
          canvas.removeEventListener('touchstart', handleTouchStart);
          window.removeEventListener('touchmove', handleTouchMove);
          window.removeEventListener('touchend', handleMouseUp);
        };
      }, [isOpen, speed]);

      const triggerConfetti = () => {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 50,
            spread: 70,
            origin: { y: 0.6 },
            shapes: ['square', 'circle'],
            colors: ['#0284c7', '#38bdf8', '#0ea5e9', '#7dd3fc', '#bae6fd']
          });
        }
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white border border-sky-200 rounded-2xl shadow-2xl max-w-xl w-full p-6 sm:p-7 relative overflow-hidden flex flex-col">
            {/* Header */}
            <div className="flex items-start justify-between pb-3 border-b border-sky-100">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-sky-100 text-sky-700 flex items-center justify-center border border-sky-200">
                  <CubeIcon className="w-5 h-5" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded bg-sky-100 text-sky-800 border border-sky-200">
                      Easter Egg
                    </span>
                    <span className="text-[11px] font-semibold text-slate-400">Capitolo G0</span>
                  </div>
                  <h3 className="text-base sm:text-lg font-bold text-slate-900">
                    Proiezione 4D: Ipercubo (Tesseract)
                  </h3>
                </div>
              </div>
              <button
                onClick={onClose}
                className="text-slate-400 hover:text-slate-700 p-1.5 rounded-lg hover:bg-slate-100 transition-colors"
                title="Chiudi dimensione"
              >
                <CloseIcon className="w-5 h-5" />
              </button>
            </div>

            {/* Canvas Interactive Area */}
            <div className="relative my-4 bg-gradient-to-b from-sky-50/50 to-white rounded-xl border border-sky-100 flex items-center justify-center overflow-hidden">
              <canvas
                ref={canvasRef}
                width={480}
                height={320}
                className="w-full h-64 sm:h-72 cursor-grab active:cursor-grabbing"
                title="Trascina con il mouse o il dito per ruotare nello spazio 4D"
              />
              <div className="absolute bottom-2 left-3 text-[10px] font-mono text-slate-400 select-none pointer-events-none">
                16 Vertici · 32 Spigoli · Rotazione continua XW / YZ
              </div>
            </div>

            {/* Geometric Theorem Box */}
            <div className="bg-sky-50 border border-sky-200 rounded-xl p-3.5 mb-4 text-xs text-slate-700 leading-relaxed font-normal">
              <p className="font-bold text-sky-900 mb-1 flex items-center gap-1.5">
                <span>Postulato N° 404 (Geometria Iperbolica):</span>
              </p>
              <p>
                «Per due rette parallele che si intersecano all'infinito, la curvatura locale diverge: è in questo spazio quadridimensionale che risiede la pagina non trovata.»
              </p>
            </div>

            {/* Controls Bar */}
            <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-sky-100 text-xs">
              <div className="flex items-center gap-1.5">
                <span className="text-[11px] font-semibold text-slate-500">Velocità:</span>
                {[0.5, 1, 2.5].map((s) => (
                  <button
                    key={s}
                    onClick={() => setSpeed(s)}
                    className={`px-2 py-1 rounded text-[11px] font-bold transition-colors ${
                      speed === s ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                    }`}
                  >
                    {s === 0.5 ? 'Lenta' : s === 1 ? 'Normale' : 'Iperspazio'}
                  </button>
                ))}
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={triggerConfetti}
                  className="px-3 py-1.5 rounded-lg font-bold text-sky-700 bg-sky-100 hover:bg-sky-200 border border-sky-200 flex items-center gap-1.5 transition-colors"
                  title="Spargi particelle geometriche"
                >
                  <SparklesIcon className="w-3.5 h-3.5" />
                  <span>Geometria</span>
                </button>
                <button
                  onClick={onClose}
                  className="px-3.5 py-1.5 rounded-lg font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 transition-colors"
                >
                  Chiudi
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Main 404 Page Component
    function NotFoundPage() {
      const [clickCount, setClickCount] = useState(0);
      const [isEasterEggOpen, setIsEasterEggOpen] = useState(false);

      const handlePenroseClick = () => {
        const next = clickCount + 1;
        setClickCount(next);
        if (next >= 3) {
          setIsEasterEggOpen(true);
          setClickCount(0);
          if (typeof confetti === 'function') {
            confetti({
              particleCount: 60,
              spread: 60,
              origin: { y: 0.5 },
              colors: ['#0284c7', '#38bdf8', '#0ea5e9']
            });
          }
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between p-4 sm:p-6">
          {/* Top Navbar */}
          <header className="max-w-4xl w-full mx-auto flex items-center justify-between pb-6 border-b border-sky-100">
            <a href="/" className="flex items-center gap-2.5 group text-decoration-none">
              <div className="w-8 h-8 rounded-lg bg-sky-600 text-white flex items-center justify-center font-black text-sm shadow-sm group-hover:bg-sky-700 transition-colors">
                G
              </div>
              <span className="font-extrabold text-lg text-slate-900 tracking-tight group-hover:text-sky-600 transition-colors">
                geometria
              </span>
            </a>

            <nav className="flex items-center gap-3">
              <a
                href="/"
                className="text-xs font-semibold text-slate-600 hover:text-sky-700 px-3 py-1.5 rounded-lg hover:bg-sky-50 transition-colors"
              >
                Teoremi & Definizioni
              </a>
              <a
                href="/test.html"
                className="text-xs font-semibold text-sky-700 bg-sky-100 hover:bg-sky-200 px-3 py-1.5 rounded-lg border border-sky-200 transition-colors"
              >
                Area Test
              </a>
            </nav>
          </header>

          {/* Main Error Content */}
          <main className="max-w-2xl w-full mx-auto my-auto py-10 sm:py-14 text-center flex flex-col items-center">
            {/* Penrose Triangle Interactive Visual */}
            <div className="mb-6">
              <PenroseTriangle onClick={handlePenroseClick} clickCount={clickCount} />
            </div>

            {/* Large 404 Headline */}
            <div className="space-y-2 mb-6">
              <div className="inline-block px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase bg-rose-50 text-rose-700 border border-rose-200">
                Errore 404 · Punto Non Valido
              </div>
              <h1 className="text-3xl sm:text-5xl font-black text-slate-900 tracking-tight">
                Spazio Non Trovato
              </h1>
              <p className="text-sm sm:text-base text-slate-600 max-w-lg mx-auto leading-relaxed pt-1">
                Le coordinate digitate non appartengono a questo piano cartesiano. È possibile che la pagina sia stata traslata all'infinito o che il teorema cercato sia indimostrabile.
              </p>
            </div>

            {/* Action Buttons */}
            <div className="flex flex-wrap items-center justify-center gap-3 mb-6">
              <a
                href="/"
                className="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl font-bold text-sm bg-sky-600 text-white hover:bg-sky-700 shadow-sm hover:shadow transition-all duration-200"
              >
                <ArrowLeftIcon className="w-4 h-4" />
                <span>Torna alla Home</span>
              </a>
              <a
                href="/test.html"
                className="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl font-bold text-sm bg-white text-slate-800 hover:bg-slate-50 border border-slate-300 shadow-sm transition-all duration-200"
              >
                <CompassIcon className="w-4 h-4 text-sky-600" />
                <span>Esegui un Test</span>
              </a>
            </div>

            {/* Secret Easter Egg Link */}
            <button
              onClick={() => setIsEasterEggOpen(true)}
              className="inline-flex items-center gap-1.5 text-xs text-sky-600 hover:text-sky-800 hover:underline pt-2 font-medium transition-colors"
            >
              <CubeIcon className="w-3.5 h-3.5" />
              <span>Esplora la quarta dimensione (Easter Egg)</span>
            </button>
          </main>

          {/* Modal */}
          <TesseractModal
            isOpen={isEasterEggOpen}
            onClose={() => setIsEasterEggOpen(false)}
          />

          {/* Footer (Consistent and strictly without emojis) */}
          <footer className="mt-8 pb-4 text-center">
            <div className="max-w-4xl mx-auto px-4">
              <div className="border-t border-sky-200/60 pt-6 space-y-1.5 text-[11px] text-slate-500 leading-relaxed font-normal">
                <p>
                  Progettato e programmato con sofferenza da <a href="https://www.instagram.com/ballarik99/#" target="_blank" rel="noopener noreferrer" className="text-sky-600 hover:text-sky-800 hover:underline">BallaRik</a> · Nessun triangolo è stato maltrattato durante lo sviluppo · v1.6.3 — Settembre 2026
                </p>
                <p>
                  © 2026 Geometria — Progetto didattico indipendente, no-profit
                </p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NotFoundPage />);
