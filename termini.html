<!DOCTYPE html>
<html lang="it" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Termini di Utilizzo - Geometria</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #ffffff;
      background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.15) 1px, transparent 1px);
      background-size: 28px 28px;
      color: #0b192c;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #e0f2fe; }
    ::-webkit-scrollbar-thumb { background: #7dd3fc; border-radius: 4px; }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState } = React;

    // HELPER: Decodes protected contact email at runtime (anti-bot scraping protection)
    function getSafeContactEmail() {
      const u = [98, 97, 108, 108, 97, 114, 105, 107, 48, 48, 49].map(c => String.fromCharCode(c)).join('');
      const d = [103, 109, 97, 105, 108, 46, 99, 111, 109].map(c => String.fromCharCode(c)).join('');
      return `${u}@${d}`;
    }

    // PROTECTED EMAIL COMPONENT (Option A - Runtime reconstruction & dynamic mailto action)
    function ProtectedEmailLink({ label = "Contattaci", variant = "link", className = "" }) {
      const [isOpen, setIsOpen] = useState(false);
      const [copied, setCopied] = useState(false);

      const handleTrigger = (e) => {
        e.preventDefault();
        const address = getSafeContactEmail();
        // Dynamic mailto execution
        window.location.href = `mailto:${address}?subject=${encodeURIComponent('Contatto da Geometria')}`;
        setIsOpen(true);
      };

      const handleCopy = (e) => {
        e.stopPropagation();
        const address = getSafeContactEmail();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(address);
          setCopied(true);
          setTimeout(() => setCopied(false), 2500);
        }
      };

      if (variant === "card") {
        return (
          <div className="mt-4 p-4 bg-sky-50/80 border border-sky-200 rounded-lg text-left">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <p className="text-xs font-bold text-sky-950">Modulo di contatto protetto anti-bot</p>
                <p className="text-[11px] text-sky-800 mt-0.5">
                  Fai clic sul pulsante per aprire il tuo client di posta o visualizzare l'indirizzo.
                </p>
              </div>
              <button
                onClick={handleTrigger}
                className="inline-flex items-center justify-center gap-1.5 px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold rounded-md shadow-sm transition-colors shrink-0"
              >
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                {label || "Scrivi ai curatori"}
              </button>
            </div>

            {isOpen && (
              <div className="mt-3 pt-3 border-t border-sky-200/80 flex flex-wrap items-center justify-between gap-2 text-xs bg-white/90 p-2.5 rounded border border-sky-100">
                <div className="flex items-center gap-2">
                  <span className="text-slate-500 font-medium text-[11px]">Indirizzo:</span>
                  <span className="font-mono text-sky-950 font-semibold selection:bg-sky-100">{getSafeContactEmail()}</span>
                </div>
                <button
                  onClick={handleCopy}
                  className="px-2.5 py-1 text-[11px] font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded transition-colors"
                >
                  {copied ? "✓ Copiato negli appunti!" : "Copia indirizzo"}
                </button>
              </div>
            )}
          </div>
        );
      }

      // Default link variant (used in Footers and inline texts)
      return (
        <span className="inline-block relative">
          <button
            type="button"
            onClick={handleTrigger}
            className={className || "text-sky-600 hover:text-sky-800 underline font-medium cursor-pointer"}
          >
            {label}
          </button>

          {isOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs" onClick={() => setIsOpen(false)}>
              <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-5 border border-sky-200 text-left" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                    <svg className="w-4 h-4 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    Contatta Geometria
                  </h3>
                  <button onClick={() => setIsOpen(false)} className="text-slate-400 hover:text-slate-600 text-sm font-bold">✕</button>
                </div>
                <div className="py-4 space-y-2">
                  <p className="text-xs text-slate-600">
                    Il tuo client di posta predefinito è stato aperto con l'indirizzo dei curatori:
                  </p>
                  <div className="p-2.5 bg-sky-50 border border-sky-100 rounded text-center font-mono text-xs text-sky-950 font-bold select-all">
                    {getSafeContactEmail()}
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                  <button
                    onClick={handleCopy}
                    className="px-3 py-1.5 text-xs font-semibold bg-sky-100 hover:bg-sky-200 text-sky-900 rounded-md transition-colors"
                  >
                    {copied ? "✓ Copiato!" : "Copia indirizzo"}
                  </button>
                  <button
                    onClick={() => {
                      window.location.href = `mailto:${getSafeContactEmail()}?subject=${encodeURIComponent('Contatto da Geometria')}`;
                    }}
                    className="px-3 py-1.5 text-xs font-semibold bg-sky-600 hover:bg-sky-700 text-white rounded-md transition-colors"
                  >
                    Apri posta
                  </button>
                </div>
              </div>
            </div>
          )}
        </span>
      );
    }

    // GLOBAL FOOTER COMPONENT
    function GlobalFooter() {
      return (
        <footer className="mt-auto pb-8 pt-12 text-center">
          <div className="max-w-4xl mx-auto px-4">
            <div className="border-t border-sky-200/80 pt-6 space-y-2">
              <p className="text-xs font-semibold text-slate-800">
                © 2026 Geometria — Progetto didattico indipendente, no-profit.
              </p>
              <p className="text-[11px] text-slate-600">
                Codice sorgente sotto licenza <a href="/LICENSE" target="_blank" rel="noopener noreferrer" className="text-sky-600 hover:text-sky-800 underline font-medium">MIT</a> · Contenuti didattici sotto licenza <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer" className="text-sky-600 hover:text-sky-800 underline font-medium">CC BY 4.0</a>
              </p>
              <div className="flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-[11px] pt-1 text-slate-500">
                <a href="/termini" className="text-sky-600 hover:text-sky-800 underline font-medium">
                  Termini di Utilizzo
                </a>
                <span>·</span>
                <a href="https://github.com/Ballarik/Geometria" target="_blank" rel="noopener noreferrer" className="text-sky-600 hover:text-sky-800 underline font-medium">
                  Repository GitHub
                </a>
                <span>·</span>
                <ProtectedEmailLink label="Contattaci" />
              </div>
            </div>
          </div>
        </footer>
      );
    }

    // TERMS OF SERVICE PAGE COMPONENT
    function TerminiPage() {
      return (
        <div className="min-h-screen flex flex-col">
          {/* HEADER / NAVIGATION BAR */}
          <header className="bg-white/90 backdrop-blur-md border-b border-sky-100 sticky top-0 z-40">
            <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
              <a href="/" className="inline-flex items-center gap-2 text-sky-900 font-bold text-sm hover:text-sky-600 transition-colors">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Torna a Geometria
              </a>
              <span className="text-[11px] uppercase tracking-wider font-bold text-sky-600 bg-sky-50 px-2.5 py-1 rounded-full border border-sky-200">
                Termini Ufficiali
              </span>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="max-w-4xl mx-auto px-4 py-10 flex-1">
            <div className="bg-white/95 rounded-2xl border border-sky-200 shadow-sm p-6 sm:p-10 space-y-8">
              
              {/* TITLE BANNER */}
              <div className="border-b border-sky-100 pb-6">
                <span className="text-[11px] font-bold uppercase tracking-wider text-sky-600">Condizioni Generali</span>
                <h1 className="text-2xl sm:text-3xl font-extrabold text-[#0b192c] mt-1">
                  TERMINI DI UTILIZZO DEL SERVIZIO
                </h1>
                <p className="text-xs text-slate-500 mt-2 font-medium">
                  Ultimo aggiornamento: Settembre 2026
                </p>
                <div className="mt-4 p-4 bg-sky-50/70 border-l-4 border-sky-500 rounded-r-lg text-xs leading-relaxed text-sky-950 font-medium">
                  Benvenuto su Geometria (di seguito &quot;la Piattaforma&quot;). L'accesso e l'utilizzo del sito web implicano l'accettazione integrale dei presenti Termini di Utilizzo. Se non concordi con uno qualsiasi dei seguenti punti, ti invitiamo a non utilizzare la Piattaforma.
                </div>
              </div>

              {/* SECTION 1 */}
              <section className="space-y-3">
                <h2 className="text-base font-bold text-[#0b192c] flex items-center gap-2 border-b border-slate-100 pb-2">
                  <span className="w-6 h-6 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center text-xs font-extrabold">1</span>
                  Finalità del Servizio e Natura del Progetto
                </h2>
                <div className="space-y-2 text-xs text-slate-700 leading-relaxed pl-8">
                  <p>
                    <strong>1.1.</strong> La Piattaforma è uno strumento indipendente e no-profit, sviluppato da studenti a scopo puramente didattico e di supporto allo studio della geometria (definizioni, teoremi, dimostrazioni ed esercitazioni), rivolto a studenti di ogni ordine e grado (scuola secondaria, università, autodidatti).
                  </p>
                  <p>
                    <strong>1.2.</strong> La Piattaforma non è affiliata ufficialmente ad alcuna scuola, istituto, dipartimento universitario o istituzione accademica, e non sostituisce in alcun modo i libri di testo, le lezioni o il materiale ufficiale fornito da docenti e istituti scolastici.
                  </p>
                </div>
              </section>

              {/* SECTION 2 */}
              <section className="space-y-3">
                <h2 className="text-base font-bold text-[#0b192c] flex items-center gap-2 border-b border-slate-100 pb-2">
                  <span className="w-6 h-6 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center text-xs font-extrabold">2</span>
                  Limitazione di Responsabilità (Disclaimer Didattico)
                </h2>
                <div className="space-y-2 text-xs text-slate-700 leading-relaxed pl-8">
                  <p>
                    <strong>2.1.</strong> Nonostante il costante impegno nel verificare l'accuratezza di enunciati, definizioni e dimostrazioni, i contenuti possono contenere errori materiali, refusi, imprecisioni o omissioni.
                  </p>
                  <p>
                    <strong>2.2.</strong> L'utilizzo dei contenuti a supporto della preparazione scolastica o universitaria (verifiche, interrogazioni, esami, concorsi) rimane sotto la responsabilità dell'utente, che è invitato a verificare sempre le informazioni con il materiale ufficiale e i docenti di riferimento. Nei limiti consentiti dalla legge applicabile, i creatori e i collaboratori della Piattaforma non rispondono di esiti negativi in sede di valutazione scolastica o di qualsiasi danno diretto o indiretto derivante dall'affidamento sui contenuti presenti sul sito. Resta ferma la responsabilità per dolo o colpa grave, non esclusa né limitata ai sensi di legge.
                  </p>
                </div>
              </section>

              {/* SECTION 3 */}
              <section className="space-y-3">
                <h2 className="text-base font-bold text-[#0b192c] flex items-center gap-2 border-b border-slate-100 pb-2">
                  <span className="w-6 h-6 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center text-xs font-extrabold">3</span>
                  Area Test e Funzionalità di Machine Learning
                </h2>
                <div className="space-y-2 text-xs text-slate-700 leading-relaxed pl-8">
                  <p>
                    <strong>3.1.</strong> La sezione test include algoritmi e modelli di classificazione/machine learning per la valutazione automatizzata delle risposte aperte.
                  </p>
                  <p>
                    <strong>3.2.</strong> <strong>Impegno di sincerità e integrità:</strong> Accedendo all'Area Test, l'utente si impegna a fornire un riscontro veritiero e sincero (auto-valutazione corretto/errato) ed è vietato inserire intenzionalmente valutazioni o risposte fuorvianti, offensive, spam o atte a degradare la precisione del modello condiviso. La Piattaforma si riserva il diritto di limitare o escludere l'accesso a chi adotti comportamenti manifestamente abusivi verso questa funzionalità.
                  </p>
                  <p>
                    <strong>3.3.</strong> Le risposte fornite nei test possono essere archiviate, in forma pseudonimizzata, al fine di addestrare, rifinire e migliorare la precisione del modello di valutazione. Per i dettagli sul trattamento dei dati si rimanda all'Informativa Privacy.
                  </p>
                </div>
              </section>

              {/* SECTION 4 */}
              <section className="space-y-3">
                <h2 className="text-base font-bold text-[#0b192c] flex items-center gap-2 border-b border-slate-100 pb-2">
                  <span className="w-6 h-6 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center text-xs font-extrabold">4</span>
                  Dati e Salvataggio
                </h2>
                <div className="space-y-2 text-xs text-slate-700 leading-relaxed pl-8">
                  <p>
                    <strong>4.1.</strong> La Piattaforma è progettata per minimizzare la raccolta di dati personali. Non è richiesta alcuna registrazione con credenziali personali.
                  </p>
                  <p>
                    <strong>4.2.</strong> Le preferenze di studio, lo storico delle sessioni e i parametri di ripetizione dilazionata possono essere memorizzati localmente sul dispositivo dell'utente (localStorage) e/o su database cloud remoto (Supabase), secondo quanto descritto nell'Informativa Privacy.
                  </p>
                  <p>
                    <strong>4.3.</strong> Tramite l'apposito visualizzatore dell'archivio (&quot;Archivio Apprendimento&quot;), gli utenti possono visualizzare e richiedere la cancellazione definitiva di specifiche risposte memorizzate, secondo le modalità indicate nell'Informativa Privacy.
                  </p>
                </div>
              </section>

              {/* SECTION 5 */}
              <section className="space-y-3">
                <h2 className="text-base font-bold text-[#0b192c] flex items-center gap-2 border-b border-slate-100 pb-2">
                  <span className="w-6 h-6 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center text-xs font-extrabold">5</span>
                  Proprietà Intellettuale e Licenza
                </h2>
                <div className="space-y-2 text-xs text-slate-700 leading-relaxed pl-8">
                  <p>
                    <strong>5.1.</strong> Il codice sorgente dell'applicazione è rilasciato con licenza <strong>MIT</strong>. Il testo integrale della licenza è disponibile nel <a href="/LICENSE" target="_blank" rel="noopener noreferrer" className="text-sky-600 underline font-medium">repository ufficiale del progetto su GitHub</a>.
                  </p>
                  <p>
                    <strong>5.2.</strong> I contenuti didattici (testi di teoremi, definizioni, dimostrazioni, esercizi) sono rilasciati con licenza <strong>Creative Commons Attribuzione 4.0 Internazionale (CC BY 4.0)</strong>. È quindi consentito copiare, modificare e distribuire tali contenuti, anche per scopi commerciali, a condizione che venga sempre citata la fonte originale (Piattaforma Geometria) e indicati eventuali cambiamenti apportati.
                  </p>
                  <p>
                    <strong>5.3.</strong> È vietata qualsiasi attività di web scraping massivo non autorizzato o tentativo di manomissione delle API e delle risorse del database, indipendentemente dai termini delle licenze sopra indicate.
                  </p>
                </div>
              </section>

              {/* SECTION 6 */}
              <section className="space-y-3">
                <h2 className="text-base font-bold text-[#0b192c] flex items-center gap-2 border-b border-slate-100 pb-2">
                  <span className="w-6 h-6 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center text-xs font-extrabold">6</span>
                  Uso Accettabile e Sicurezza
                </h2>
                <div className="text-xs text-slate-700 leading-relaxed pl-8">
                  <p className="mb-2">L'utente si impegna a:</p>
                  <ul className="list-disc list-inside space-y-1.5 ml-2 text-slate-600">
                    <li>non sovraccaricare, manomettere o tentare accessi non autorizzati all'infrastruttura di backend, alle chiavi API o ai database collegati;</li>
                    <li>non utilizzare script automatizzati o bot per alterare i punteggi o inviare richieste malevole;</li>
                    <li>rispettare lo scopo costruttivo e collaborativo della piattaforma.</li>
                  </ul>
                </div>
              </section>

              {/* SECTION 7 */}
              <section className="space-y-3">
                <h2 className="text-base font-bold text-[#0b192c] flex items-center gap-2 border-b border-slate-100 pb-2">
                  <span className="w-6 h-6 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center text-xs font-extrabold">7</span>
                  Modifiche al Servizio e ai Termini
                </h2>
                <div className="text-xs text-slate-700 leading-relaxed pl-8">
                  <p>
                    I gestori della Piattaforma si riservano il diritto di modificare, sospendere o interrompere qualsiasi funzionalità del sito in qualunque momento, nonché di aggiornare i presenti Termini di Utilizzo. Le modifiche saranno effettive dal momento della loro pubblicazione sulla Piattaforma.
                  </p>
                </div>
              </section>

              {/* SECTION 8 */}
              <section className="space-y-3">
                <h2 className="text-base font-bold text-[#0b192c] flex items-center gap-2 border-b border-slate-100 pb-2">
                  <span className="w-6 h-6 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center text-xs font-extrabold">8</span>
                  Legge Applicabile e Foro Competente
                </h2>
                <div className="text-xs text-slate-700 leading-relaxed pl-8">
                  <p>
                    I presenti Termini sono regolati dalla legge italiana. Per qualsiasi controversia non risolvibile in via amichevole sarà competente il foro del luogo di residenza dell'utente, ove qualificabile come consumatore ai sensi di legge; negli altri casi, il foro competente è quello del titolare della Piattaforma.
                  </p>
                </div>
              </section>

              {/* SECTION 9 */}
              <section className="space-y-3">
                <h2 className="text-base font-bold text-[#0b192c] flex items-center gap-2 border-b border-slate-100 pb-2">
                  <span className="w-6 h-6 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center text-xs font-extrabold">9</span>
                  Segnalazioni e Contatti
                </h2>
                <div className="text-xs text-slate-700 leading-relaxed pl-8 space-y-3">
                  <p>
                    Per segnalare errori matematici, refusi, violazioni o problemi di sicurezza, è possibile aprire una issue sul <a href="https://github.com/Ballarik/Geometria/issues" target="_blank" rel="noopener noreferrer" className="text-sky-600 underline font-bold">repository ufficiale GitHub del progetto</a> oppure contattare i curatori tramite il modulo di contatto protetto presente qui sotto:
                  </p>
                  
                  {/* PROTECTED EMAIL COMPONENT EMBEDDED IN SECTION 9 */}
                  <ProtectedEmailLink variant="card" label="Contatta i curatori via Email" />
                </div>
              </section>

            </div>
          </main>

          {/* GLOBAL FOOTER */}
          <GlobalFooter />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<TerminiPage />);
  </script>
</body>
</html>
