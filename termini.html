    body {

<body class="antialiased min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState } = React;

    // HELPER: Decodes protected contact email at runtime (anti-bot scraping protection)
    function getSafeContactEmail() {
      const u = [98, 97, 108, 108, 97, 114, 105, 107, 48, 48, 49].map(c => String.fromCharCode(c)).join('');
      const d = [103, 109, 97, 105, 108, 46, 99, 111, 109].map(c => String.fromCharCode(c)).join('');
      return `${u}@${d}`;
    }

    // ANTI-BOT VERIFICATION WIDGET FOR EMAIL
    function AntiBotEmailWidget() {
      const [isVerified, setIsVerified] = useState(false);
      const [showChallenge, setShowChallenge] = useState(false);
      const [challenge, setChallenge] = useState(null);
      const [errorMessage, setErrorMessage] = useState('');
      const [copied, setCopied] = useState(false);

      const generateChallenge = () => {
        const a = Math.floor(Math.random() * 6) + 2;
        const b = Math.floor(Math.random() * 5) + 1;
        const correct = a + b;
        const d1 = correct + 1;
        const d2 = correct - 1 === a ? correct + 2 : correct - 1;
        const options = [correct, d1, d2].sort(() => Math.random() - 0.5);
        return { a, b, correct, options };
      };

      const handleStartVerification = () => {
        if (!challenge) {
          setChallenge(generateChallenge());
        }
        setShowChallenge(true);
        setErrorMessage('');
      };

      const handleAnswer = (selected) => {
        if (challenge && selected === challenge.correct) {
          setIsVerified(true);
          setShowChallenge(false);
          setErrorMessage('');
        } else {
          setErrorMessage('Risposta non corretta. Prova con questa nuova operazione:');
          setChallenge(generateChallenge());
        }
      };

      const handleCopy = () => {
        const email = getSafeContactEmail();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(email);
          setCopied(true);
          setTimeout(() => setCopied(false), 2500);
        }
      };

      const handleSendEmail = () => {
        const email = getSafeContactEmail();
        window.location.href = `mailto:${email}?subject=${encodeURIComponent('Contatto da Geometria')}`;
      };

      return (
        <div className="mt-4 p-4 bg-sky-50/80 border border-sky-200 rounded-xl text-left">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-base">🛡️</span>
            <h3 className="text-xs font-bold text-sky-950 uppercase tracking-wide">
              Contatto e-mail curatori (Protetto da verifica anti-bot)
            </h3>
          </div>

          {!isVerified ? (
            <div className="space-y-3">
              <p className="text-xs text-slate-600">
                Per visualizzare l'indirizzo email dei curatori e prevenire lo spam da bot automatizzati, completa la rapida verifica di sicurezza:
              </p>

              {!showChallenge ? (
                <button
                  type="button"
                  onClick={handleStartVerification}
                  className="inline-flex items-center gap-2 px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold rounded-lg shadow-sm transition-all active:scale-[0.98]"
                >
                  <span className="w-3.5 h-3.5 rounded border border-white/80 bg-white/20 inline-block"></span>
                  Clicca qui per verificare che sei umano
                </button>
              ) : (
                <div className="p-3 bg-white border border-sky-200 rounded-lg space-y-2.5 max-w-md">
                  <p className="text-xs font-semibold text-slate-800">
                    Dimostra di non essere un bot: quanto fa <span className="font-bold text-sky-700">{challenge.a} + {challenge.b}</span>?
                  </p>
                  {errorMessage && (
                    <p className="text-[11px] text-rose-600 font-medium">{errorMessage}</p>
                  )}
                  <div className="flex items-center gap-2 pt-1">
                    {challenge.options.map((opt, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => handleAnswer(opt)}
                        className="px-3.5 py-1.5 bg-slate-100 hover:bg-sky-600 hover:text-white text-slate-800 text-xs font-bold rounded-md transition-colors border border-slate-200 hover:border-sky-600"
                      >
                        {opt}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
          ) : (
            <div className="space-y-3 pt-1">
              <div className="flex items-center gap-1.5 text-xs text-emerald-700 font-semibold bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-md inline-flex">
                <span>✓</span> Verifica umana superata con successo
              </div>
              <div className="flex flex-wrap items-center justify-between gap-3 bg-white p-3 rounded-lg border border-sky-100">
                <div className="space-y-0.5">
                  <p className="text-[10px] text-slate-500 font-medium uppercase tracking-wider">Indirizzo email curatori</p>
                  <p className="font-mono text-xs font-bold text-slate-900 selection:bg-sky-100">
                    {getSafeContactEmail()}
                  </p>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={handleCopy}
                    className="px-3 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition-colors"
                  >
                    {copied ? "✓ Copiato!" : "Copia indirizzo"}
                  </button>
                  <button
                    type="button"
                    onClick={handleSendEmail}
                    className="px-3.5 py-1.5 text-xs font-bold bg-sky-600 hover:bg-sky-700 text-white rounded-md transition-colors shadow-sm"
                  >
                    Invia Email →
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

                  <span className="w-6 h-6 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center text-xs font-extrabold">1</span>

                  <span className="w-6 h-6 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center text-xs font-extrabold">3</span>
                  Area Test e Funzionalità di Machine Learning
                </h2>
                <div className="space-y-2 text-xs text-slate-700 leading-relaxed pl-8">

                  </p>
                </div>
              </section>

              {/* SECTION 4 */}
              <section className="space-y-3">
                <h2 className="text-base font-bold text-[#0b192c] flex items-center gap-2 border-b border-slate-100 pb-2">
                  <span className="w-6 h-6 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center text-xs font-extrabold">4</span>
                  Dati e Salvataggio

                <div className="space-y-2 text-xs text-slate-700 leading-relaxed pl-8">

                    <strong>4.1.</strong> La Piattaforma è progettata per minimizzare la raccolta di dati personali. Non è richiesta alcuna registrazione con credenziali personali.
                  </p>
                  <p>
                    <strong>4.2.</strong> Le preferenze di studio, lo storico delle sessioni e i parametri di ripetizione dilazionata possono essere memorizzati localmente sul dispositivo dell'utente (localStorage) e/o su database cloud remoto (Supabase), secondo quanto descritto nell'Informativa Privacy.
                  </p>
                  <p>
                    <strong>4.3.</strong> Tramite l'apposito visualizzatore dell'archivio (&quot;Archivio Apprendimento&quot;), gli utenti possono visualizzare e richiedere la cancellazione definitiva di specifiche risposte memorizzate, secondo le modalità indicate nell'Informativa Privacy.
                  </p>
                </div>
              </section>

              {/* SECTION 5 */}
              <section className="space-y-3">
                <h2 className="text-base font-bold text-[#0b192c] flex items-center gap-2 border-b border-slate-100 pb-2">
                  <span className="w-6 h-6 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center text-xs font-extrabold">5</span>
