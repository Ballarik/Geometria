      for (let i = 0; i < 6; i++) {

      return `${chapter}-${typeChar}-${randomCode}`;

        for (const oldKey of oldKeys) {
          const oldData = localStorage.getItem(oldKey);
          if (oldData) {
            const parsed = JSON.parse(oldData);
            if (Array.isArray(parsed) && parsed.length > 0) {
              const migrated = parsed.map(item => ({
                ...item,
                code: item.code || generateItemCode(item.chapter, item.type)
              }));
              localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
              return migrated;
            }

        }
        return INITIAL_DATA;

    const getSupabaseClient = () => {
      try {
        const url = window.VITE_SUPABASE_URL || (typeof process !== 'undefined' && process.env?.VITE_SUPABASE_URL) || localStorage.getItem('VITE_SUPABASE_URL') || SUPABASE_CONFIG.url;

      // Save to Supabase Cloud Database

            const { error: singleErr } = await sp.from('items').upsert(singleItem);

              await sp.from('items').upsert(items);
            }

            const { error: batchErr } = await sp.from('items').upsert(items);

    // MATH RENDER COMPONENT
    const MathRender = ({ content, className = '' }) => {
      if (!content) return null;
      
      const parseMath = (text) => {
        const parts = [];
        let lastIdx = 0;
        const regex = /\$\$(.*?)\$\$|\$(.*?)\$/g;
        let m;
        while ((m = regex.exec(text)) !== null) {
          if (m.index > lastIdx) parts.push({ type: 'text', value: text.substring(lastIdx, m.index) });
          if (m[1] !== undefined) parts.push({ type: 'math', value: m[1], display: true });
          else if (m[2] !== undefined) parts.push({ type: 'math', value: m[2], display: false });
          lastIdx = regex.lastIndex;
        }
        if (lastIdx < text.length) parts.push({ type: 'text', value: text.substring(lastIdx) });
        return parts;
      };

      return (
        <div className={`whitespace-pre-wrap ${className}`}>
          {parseMath(content).map((p, idx) => {
            if (p.type === 'math') {
              try {
                const html = katex.renderToString(p.value, { displayMode: p.display, throwOnError: false });
                return <span key={idx} dangerouslySetInnerHTML={{ __html: html }} />;
              } catch(e) { return <code key={idx}>${p.value}$</code>; }
            }
            const formatted = p.value.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>');
            return <span key={idx} dangerouslySetInnerHTML={{ __html: formatted }} />;
          })}
        </div>
      );
    };

    // TOOLBAR MATH SYMBOLS INSERTION COMPONENT
    const MathSymbolsToolbar = ({ textareaRef, value, setValue }) => {
      const [showExtended, setShowExtended] = useState(false);

      const handleInsert = (symbolCode) => {
        if (!textareaRef.current) {
          setValue(value + symbolCode);
          return;
        }
        const el = textareaRef.current;
        const start = el.selectionStart || 0;
        const end = el.selectionEnd || 0;
        const newValue = value.substring(0, start) + symbolCode + value.substring(end);
        setValue(newValue);

        setTimeout(() => {
          el.focus();
          const newPos = start + symbolCode.length;
          el.setSelectionRange(newPos, newPos);
        }, 10);
      };

      return (

    function checkProhibitedContent(text) {
      if (!text || typeof text !== 'string') return false;
      try {
        const norm = text.toLowerCase()
          .replace(/1|!|\|/g, 'i')
          .replace(/0/g, 'o')
          .replace(/3/g, 'e')
          .replace(/4|@/g, 'a')
          .replace(/5|\$/g, 's')
          .replace(/7/g, 't')
          .replace(/8/g, 'b')
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

        const despaced = norm.replace(/\b([a-z0-9])[\s._\-\*]+([a-z0-9])[\s._\-\*]+([a-z0-9])(?:[\s._\-\*]+([a-z0-9]))?(?:[\s._\-\*]+([a-z0-9]))?(?:[\s._\-\*]+([a-z0-9]))?\b/gi, m => m.replace(/[\s._\-\*]+/g, ''));
        const words = despaced.replace(/[^a-z0-9]/g, ' ').split(/\s+/).filter(Boolean);

        const decRaw = atob(_SEC_PAYLOAD);
        const terms = decRaw.split('').map(c => String.fromCharCode(c.charCodeAt(0) ^ _SEC_KEY)).join('').split('|');

        for (let i = 0; i < terms.length; i++) {
          const tClean = terms[i].toLowerCase().replace(/[^a-z0-9]/g, '');
          const tCollapsed = tClean.replace(/(.)\1+/g, '$1');

          for (let j = 0; j < words.length; j++) {
            const wClean = words[j].replace(/[^a-z0-9]/g, '');
            const wCollapsed = wClean.replace(/(.)\1+/g, '$1');
            if (wClean === tClean || wCollapsed === tCollapsed) {
              return true;
            }
            if (tClean.length >= 7 && (wClean.includes(tClean) || wCollapsed.includes(tCollapsed))) {
              return true;
            }
          }
        }

        if (/\b(d[i1!|][o0]|g[e3]s[uù]|cr[i1!|]st[o0]|m[a4@]d[o0]nn[a4@]|m[a4@]h?o0?m[e3]tt[o0]|y[a4@]hw[e3]h|z[e3]us)\b/i.test(norm)) {

        const raw = atob(_AUTH_PAYLOAD);
        let s = "";
        for (let i = 0; i < raw.length; i++) {
          s += String.fromCharCode(raw.charCodeAt(i) ^ _AUTH_K);
        }
        return s;
      } catch (e) {
        return "";
      }
    }

    const _B32_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
    function base32ToBytes(b32) {
      let bits = "";
      for (let i = 0; i < b32.length; i++) {
        const val = _B32_CHARS.indexOf(b32.charAt(i).toUpperCase());
        if (val === -1) continue;
        bits += val.toString(2).padStart(5, "0");
      }
      const bytes = [];
      for (let i = 0; i + 8 <= bits.length; i += 8) {
        bytes.push(parseInt(bits.substr(i, 8), 2));
      }
      return new Uint8Array(bytes);
    }

    function pureSha1(bytes) {
      let words = [];
      for (let i = 0; i < bytes.length; i++) {
        words[i >> 2] |= (bytes[i] & 0xff) << (24 - (i % 4) * 8);
      }
      const byteLen = bytes.length * 8;
      words[byteLen >> 5] |= 0x80 << (24 - (byteLen % 32));
      words[(((byteLen + 64) >> 9) << 4) + 15] = byteLen;

      let h0 = 0x67452301, h1 = 0xefcdab89, h2 = 0x98badcfe, h3 = 0x10325476, h4 = 0xc3d2e1f0;
      const w = new Int32Array(80);

      for (let i = 0; i < words.length; i += 16) {
        for (let j = 0; j < 16; j++) w[j] = words[i + j] | 0;
        for (let j = 16; j < 80; j++) {
          const n = w[j - 3] ^ w[j - 8] ^ w[j - 14] ^ w[j - 16];
          w[j] = (n << 1) | (n >>> 31);
        }
        let a = h0, b = h1, c = h2, d = h3, e = h4;
        for (let j = 0; j < 80; j++) {
          let f, k;
          if (j < 20) { f = (b & c) | ((~b) & d); k = 0x5a827999; }
          else if (j < 40) { f = b ^ c ^ d; k = 0x6ed9eba1; }
          else if (j < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8f1bbcdc; }
          else { f = b ^ c ^ d; k = 0xca62c1d6; }
          const temp = (((a << 5) | (a >>> 27)) + f + e + k + w[j]) | 0;
          e = d; d = c; c = (b << 30) | (b >>> 2); b = a; a = temp;
        }
        h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0;
      }
      const res = new Uint8Array(20);
      const hs = [h0, h1, h2, h3, h4];
      for (let i = 0; i < 5; i++) {
        res[i*4] = (hs[i] >>> 24) & 0xff;
        res[i*4+1] = (hs[i] >>> 16) & 0xff;
        res[i*4+2] = (hs[i] >>> 8) & 0xff;
        res[i*4+3] = hs[i] & 0xff;
      }
      return res;
    }

    function pureHmacSha1(key, msg) {
      let k = new Uint8Array(key);
      if (k.length > 64) k = pureSha1(k);
      const kPad = new Uint8Array(64);
      kPad.set(k);
      const ipad = new Uint8Array(64), opad = new Uint8Array(64);
      for (let i = 0; i < 64; i++) {
        ipad[i] = kPad[i] ^ 0x36;
        opad[i] = kPad[i] ^ 0x5c;
      }
      const inner = new Uint8Array(64 + msg.length);
      inner.set(ipad);
      inner.set(msg, 64);
      const innerHash = pureSha1(inner);
      const outer = new Uint8Array(64 + 20);
      outer.set(opad);
      outer.set(innerHash, 64);
      return pureSha1(outer);
    }

    function computeTotpAtStep(keyBytes, stepBigInt) {
      const msg = new Uint8Array(8);
      const view = new DataView(msg.buffer);
      view.setBigUint64(0, stepBigInt, false);
      const sig = pureHmacSha1(keyBytes, msg);
      const offset = sig[sig.length - 1] & 0x0f;
      const binary =
        ((sig[offset] & 0x7f) << 24) |
        ((sig[offset + 1] & 0xff) << 16) |
        ((sig[offset + 2] & 0xff) << 8) |
        (sig[offset + 3] & 0xff);
      return (binary % 1000000).toString().padStart(6, "0");
    }

    function verifyTotpCode(inputCode) {
      if (!inputCode || typeof inputCode !== "string") return false;
      const clean = inputCode.trim().replace(/\s+/g, "");
      if (!/^\d{6}$/.test(clean)) return false;

      const secret = getAuthSecret();
      if (!secret) return false;

      const keyBytes = base32ToBytes(secret);
      const currentStep = Math.floor(Date.now() / 1000 / 30);

      for (let offset = -1; offset <= 1; offset++) {
        const step = BigInt(currentStep + offset);
        if (computeTotpAtStep(keyBytes, step) === clean) return true;
      }
      return false;
    }

                    {actionDescription}

    // MAIN APP COMPONENT
    function App() {

      const [modalConfig, setModalConfig] = useState(null);
      
      // Catalog filters

      const [chapterFilter, setChapterFilter] = useState('all');
      const [search, setSearch] = useState('');
      const [selectedItem, setSelectedItem] = useState(null);

      // Wizard State (4 Steps) - DEFAULT CHAPTER IS 'N'
      const [wStep, setWStep] = useState(1);
      const [wType, setWType] = useState('definition');
      const [wChapter, setWChapter] = useState('N');
      const [wName, setWName] = useState('');
      const [wContent, setWContent] = useState('');
      const [wProof, setWProof] = useState('');
      const [wNotes, setWNotes] = useState('');
      const [wImages, setWImages] = useState([]);
      
      // VALIDATION ERRORS
      const [wError, setWError] = useState('');
      const [invalidFields, setInvalidFields] = useState({});

      // REFS FOR TEXTAREAS
      const wContentRef = useRef(null);
      const wProofRef = useRef(null);

      // AUTHENTICATOR MODAL STATE & HANDLER
      const [authModal, setAuthModal] = useState({
        isOpen: false,
        actionTitle: '',
        actionDescription: '',
        onConfirm: null
      });

      const requireAuth = (title, description, onConfirmCallback) => {
        setAuthModal({
          isOpen: true,
          actionTitle: title,
          actionDescription: description,
          onConfirm: () => {
            setAuthModal(prev => ({ ...prev, isOpen: false }));
            if (onConfirmCallback) onConfirmCallback();
          }
        });
      };

      // LOAD DATA ON STARTUP: Supabase Cloud DB first → Server API → localStorage → data.json fallback
      useEffect(() => {
        const loadData = async () => {
          // 0. Try Supabase Cloud Database (if credentials configured)
          const sp = getSupabaseClient();
          if (sp) {
            try {
              const { data, error } = await sp.from('items').select('*');
              if (!error && Array.isArray(data) && data.length > 0) {
                setItems(data);
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
                setDataLoaded(true);
                return;
              }
            } catch(e) {}
          }

          // 1. Try server API (when running via node server.js)
          try {
            const res = await fetch('/api/data');
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              setItems(data);
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
              setDataLoaded(true);
              return;
            }
          } catch(e) {}

          // 2. Try localStorage (to keep user edits and additions even if offline)
          const stored = getStoredItems();
          if (stored.length > 0) {
            setItems(stored);
            setDataLoaded(true);
            return;
          }

          // 3. Fallback to data.json only if nothing in Supabase and nothing in localStorage
          try {
            const res = await fetch('./data.json');
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              setItems(data);
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
              setDataLoaded(true);
              return;
            }
          } catch(e) {}

          setDataLoaded(true);
        };
        loadData();
      }, []);

      const resetWizard = () => {
        setWStep(1); setWType('definition'); setWChapter('N');
        setWName(''); setWContent(''); setWProof(''); setWNotes(''); setWImages([]); 
        setWError(''); setInvalidFields({});
        setEditingItemId(null);
      };

      // KEYBOARD SHORTCUT: Press 'N' or 'n' when on Home
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'n' || e.key === 'N') {
            const activeEl = document.activeElement;
            const isTyping = activeEl && (
              ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeEl.tagName) ||

              e.preventDefault();
              handleOpenCreate();
            }
          }

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isWizardOpen]);

      const filteredItems = useMemo(() => {
        return items.filter(item => {
          if (typeFilter === 'theorem' && item.type !== 'theorem') return false;
          if (typeFilter === 'definition' && item.type !== 'definition') return false;
          if (chapterFilter !== 'all' && item.chapter !== chapterFilter) return false;
          if (search.trim()) {
            const q = search.toLowerCase().trim();
            const matchesName = item.name && item.name.toLowerCase().includes(q);
            const matchesContent = item.content && item.content.toLowerCase().includes(q);
            const matchesCode = item.code && item.code.toLowerCase().includes(q);
            if (!matchesName && !matchesContent && !matchesCode) return false;
          }
          return true;
        });
      }, [items, typeFilter, chapterFilter, search]);

      const handleOpenCreate = () => {

        });

      const handleOpenEdit = (item) => {

          paragraphs: [

            'Ti chiediamo di mantenere il database accurato e di inserire solo informazioni verificate e pertinenti.',
            'Continuando accetti e confermi la correttezza dei contenuti didattici.'

          setWStep(3);

          if (!wContent.trim()) {
            setInvalidFields({ content: true });
            setWError('Inserisci il testo/enunciato prima di proseguire.');
            return;
          }
          if (checkProhibitedContent(wContent)) {
            setInvalidFields({ content: true });
            setWError('L\'enunciato/definizione contiene parole o espressioni non consentite.');
            return;

          setInvalidFields({});
          if (wType === 'theorem') {

            setWError('La dimostrazione contiene parole o espressioni non consentite.');

          }
          setInvalidFields({});
          setWStep(5);

        if (!wContent.trim()) newInvalid.content = true;

          setInvalidFields(newInvalid);

            notes: wNotes.trim(),
            images: wImages
          };
          savedItem = newItem;
          updated = [newItem, ...items];
        }

        setItems(updated);
        saveStoredItems(updated, savedItem);
        setIsWizardOpen(false);
        resetWizard();
      };

      // ENTER KEYPRESS WIZARD STEP ADVANCEMENT
      useEffect(() => {
        if (!isWizardOpen) return;
        
        const handleWizardEnter = (e) => {
          if (e.key === 'Enter') {
            const activeEl = document.activeElement;
            if (activeEl && activeEl.tagName === 'TEXTAREA') return;
            if (activeEl && activeEl.id === 'image-url-input') return;

            e.preventDefault();
            const totalSteps = wType === 'theorem' ? 5 : 4;
            if (wStep < totalSteps) {
              validateAndNextStep();
            } else {
              handleSaveWizard();
            }
          }
        };

        window.addEventListener('keydown', handleWizardEnter);
        return () => window.removeEventListener('keydown', handleWizardEnter);
      }, [isWizardOpen, wStep, wType, wChapter, wName, wContent, wProof]);

      // PASTE LISTENER FOR CLIPBOARD IMAGES
      useEffect(() => {
        if (!isWizardOpen) return;

        const handlePaste = (e) => {
          const items = e.clipboardData?.items;
          if (!items) return;

          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            if (item.type.indexOf('image') !== -1) {
              const file = item.getAsFile();
              if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                  if (evt.target?.result) {
                    setWImages(prev => [...prev, evt.target.result]);
                  }
                };
                reader.readAsDataURL(file);
              }
            }
          }
        };

        window.addEventListener('paste', handlePaste);
        return () => window.removeEventListener('paste', handlePaste);
      }, [isWizardOpen]);

      const handleDeleteItem = (id) => {
        const itemToDelete = items.find(i => i.id === id);
        const name = itemToDelete ? (itemToDelete.name || itemToDelete.code || `ID #${id}`) : `ID #${id}`;

        requireAuth(
          `Eliminazione elemento: "${name}"`,
          "L'elemento verrà rimosso definitivamente dal database Supabase e dalla memoria locale.",
          async () => {
            const updated = items.filter(i => i.id !== id);
            setItems(updated);
            saveStoredItems(updated);
            if (selectedItem && selectedItem.id === id) setSelectedItem(null);

            // Delete from Supabase Cloud Database
            const sp = getSupabaseClient();
            if (sp) {
              try { await sp.from('items').delete().eq('id', id); } catch(e){}
            }
          }
        );
      };

      return (
        <div className="min-h-screen pb-12 text-[#0b192c]">
          {/* HEADER / NAVBAR */}
          <header className="bg-white/90 border-b border-sky-200 sticky top-0 z-40 backdrop-blur-md shadow-sm">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              
              {/* LOGO */}
              <a href="/" className="flex items-center space-x-2">
                <span className="text-2xl font-bold text-sky-500 font-serif leading-none select-none">π</span>
                <h1 className="font-extrabold text-xl text-[#0b192c] tracking-tight">geometria</h1>
              </a>

              <div className="flex items-center space-x-1.5 bg-sky-50/80 p-1 rounded-md border border-sky-200">
                <span className="px-3 py-1.5 rounded-md text-xs font-bold bg-sky-600 text-white shadow-sm">
                  Consultazione
                </span>
                <button
                  onClick={handleOpenCreate}
                  title="Scorciatoia tastiera: Premi 'N' quando sei nella Home"
                  className="px-3 py-1.5 rounded-md text-xs font-bold bg-sky-600 text-white hover:bg-sky-700 shadow-sm flex items-center gap-1"
                >
                  <span>+ Nuovo Inserimento</span>
                  <span className="text-[10px] bg-sky-700 px-1 py-0.2 rounded text-sky-200 font-mono">N</span>
                </button>
                <a
                  href="/test"
                  className="px-3 py-1.5 rounded-md text-xs font-bold text-sky-900 hover:bg-sky-100 transition-all"
                >
                  Area Test
                </a>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 space-y-6">
              
              {/* FILTERS PANEL */}
              <div className="bg-sky-50/90 border border-dashed border-sky-300 rounded-md p-4 shadow-sm space-y-3">
                <div className="flex flex-col sm:flex-row gap-3 justify-between items-center">
                  <input
                    type="text"
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="Cerca per nome, codice (es. G1-D-1A2B3C) o testo..."
                    className="w-full sm:w-96 px-3.5 py-2 bg-white border border-sky-300 rounded-md text-xs text-[#0b192c] placeholder-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-500 font-medium"
                  />

                  {/* TYPE FILTERS */}
                  <div className="flex items-center space-x-1 bg-white p-1 rounded-md border border-sky-200">
                    <button onClick={() => setTypeFilter('all')} className={`px-3 py-1 rounded-md text-xs font-bold ${typeFilter === 'all' ? 'bg-sky-600 text-white' : 'text-sky-900'}`}>Tutti ({items.length})</button>
                    <button onClick={() => setTypeFilter('theorem')} className={`px-3 py-1 rounded-md text-xs font-bold ${typeFilter === 'theorem' ? 'bg-sky-700 text-white' : 'text-sky-900'}`}>Teoremi ({items.filter(i=>i.type==='theorem').length})</button>
                    <button onClick={() => setTypeFilter('definition')} className={`px-3 py-1 rounded-md text-xs font-bold ${typeFilter === 'definition' ? 'bg-sky-800 text-white' : 'text-sky-900'}`}>Definizioni ({items.filter(i=>i.type==='definition').length})</button>
                  </div>
                </div>

                {/* CHAPTER FILTERS */}
                <div className="pt-2 border-t border-dashed border-sky-300">
                  <span className="text-[11px] font-bold text-sky-900 uppercase tracking-wider block mb-1.5">Filtra per Capitolo:</span>
                  <div className="flex flex-wrap gap-1">
                    <button onClick={() => setChapterFilter('all')} className={`px-2.5 py-1 rounded-md text-xs font-bold ${chapterFilter === 'all' ? 'bg-sky-600 text-white' : 'bg-white border border-sky-200 text-sky-900 hover:bg-sky-100'}`}>Tutti</button>
                    {CHAPTERS.map(ch => (
                      <button key={ch} onClick={() => setChapterFilter(ch)} className={`px-2.5 py-1 rounded-md text-xs font-bold ${chapterFilter === ch ? 'bg-sky-600 text-white' : 'bg-white border border-sky-200 text-sky-900 hover:bg-sky-100'}`}>
                        {ch}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* GRID ITEMS OR EMPTY STATE */}
              {filteredItems.length === 0 ? (
                <div className="bg-sky-50/60 border-2 border-dashed border-sky-300 rounded-md p-10 text-center space-y-3">
                  <div className="w-12 h-12 rounded-md bg-sky-100 text-sky-600 flex items-center justify-center mx-auto text-xl font-bold">
                    📝
                  </div>
                  <h3 className="text-base font-bold text-[#0b192c]">Nessun elemento presente</h3>
                  <p className="text-sky-800 text-xs max-w-md mx-auto">
                    Il database è vuoto. Clicca su <strong>"+ Nuovo Inserimento"</strong> (o premi il tasto <strong>N</strong> sulla tastiera) per inserire i tuoi teoremi e definizioni.
                  </p>
                  <button
                    onClick={handleOpenCreate}
                    className="px-4 py-2 bg-sky-600 text-white font-bold text-xs rounded-md shadow-sm hover:bg-sky-700"
                  >
                    + Aggiungi un elemento (Tasto N)
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredItems.map(item => {
                    const itemCode = item.code || generateItemCode(item.chapter, item.type);
                    return (
                      <div
                        key={item.id}
                        onClick={() => setSelectedItem({ ...item, code: itemCode })}
                        className="bg-sky-50/70 border-2 border-dashed border-sky-300 hover:border-sky-500 hover:bg-sky-100/60 cursor-pointer rounded-md p-4 shadow-sm flex flex-col justify-between transition-all group space-y-3"
                      >
                        <div>
                          {/* TOP ROW */}
                          <div className="flex items-center justify-between mb-3">
                            <div className="flex items-center space-x-1.5 flex-wrap gap-y-1">
                              <span className="px-2 py-0.5 rounded-md bg-white border border-sky-300 text-sky-900 text-xs font-mono font-extrabold shadow-2xs">
                                {item.chapter}
                              </span>
                              <span className={`px-2 py-0.5 rounded-md text-[11px] font-extrabold uppercase ${item.type === 'theorem' ? 'bg-sky-200 text-sky-900 border border-sky-300' : 'bg-blue-100 text-blue-900 border border-blue-200'}`}>
                                {item.type === 'theorem' ? 'TEOREMA' : 'DEFINIZIONE'}
                              </span>
                              <span className="px-2 py-0.5 rounded-md bg-sky-900 text-white text-[11px] font-mono font-bold tracking-wider">
                                {itemCode}
                              </span>
                            </div>

                            <TriangleMenu
                              onEdit={() => handleOpenEdit(item)}
                              onDelete={() => handleDeleteItem(item.id)}
                            />
                          </div>

                          {/* SECOND ROW */}
                          <h3 className="text-base font-black text-[#0b192c] group-hover:text-sky-700 transition-colors uppercase tracking-wide mb-2">
                            {item.name}
                          </h3>

                          {/* THIRD ROW */}
                          <div className="text-[#0b192c] text-xs leading-relaxed line-clamp-5">
                            <MathRender content={item.content} />
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </main>

          {/* ITEM DETAIL MODAL */}
          {selectedItem && (
            <div
              className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4"
              onClick={() => setSelectedItem(null)}
            >
              <div
                className="bg-white border border-sky-200 rounded-md max-w-2xl w-full max-h-[90vh] flex flex-col p-6 shadow-xl"
                onClick={(e) => e.stopPropagation()}
              >
                {/* Header (Fisso in alto) */}
                <div className="flex justify-between items-center border-b border-sky-100 pb-3 shrink-0 mb-3">
                  <div className="flex items-center space-x-2">
                    <span className="px-2 py-0.5 rounded-md bg-[#0b192c] text-white text-xs font-mono font-bold">{selectedItem.chapter}</span>
                    <span className="text-xs font-bold text-sky-900 uppercase">[{selectedItem.type}]</span>
                    <span className="px-2 py-0.5 rounded-md bg-sky-900 text-white text-xs font-mono font-bold">{selectedItem.code}</span>
                  </div>

                  <TriangleMenu
                    onEdit={() => {
                      handleOpenEdit(selectedItem);
                      setSelectedItem(null);
                    }}
                    onDelete={() => handleDeleteItem(selectedItem.id)}
                  />
                </div>

                {/* Corpo Scorrevole */}
                <div className="overflow-y-auto space-y-4 pr-1.5 flex-1">
                  <h2 className="text-xl font-black text-[#0b192c] uppercase">{selectedItem.name}</h2>
                  <div className="bg-sky-50/80 border border-sky-200 p-4 rounded-md">
                    <h4 className="text-xs text-sky-900 font-bold uppercase mb-1">Enunciato / Testo</h4>
                    <MathRender content={selectedItem.content} className="text-[#0b192c] text-sm" />
                  </div>
                  {selectedItem.proof && (
                    <div className="bg-sky-100/50 border border-sky-300 p-4 rounded-md">
                      <h4 className="text-xs text-sky-950 font-bold uppercase mb-1">Dimostrazione</h4>
                      <MathRender content={selectedItem.proof} className="text-[#0b192c] text-sm" />
                    </div>
                  )}
                  {selectedItem.notes && (
                    <div className="bg-amber-50 border border-amber-200 p-4 rounded-md">
                      <h4 className="text-xs text-amber-900 font-bold uppercase mb-1">Note / Osservazioni</h4>
                      <p className="text-slate-800 text-xs whitespace-pre-wrap">{selectedItem.notes}</p>
                    </div>
                  )}
                  {selectedItem.images && selectedItem.images.length > 0 && (
                    <div className="bg-indigo-50 border border-indigo-200 p-4 rounded-md space-y-3">
                      <h4 className="text-xs text-indigo-900 font-bold uppercase">🖼️ Immagini</h4>
                      <div className="space-y-3">
                        {selectedItem.images.map((url, idx) => (
                          <div key={idx} className="space-y-1">
                            <img
                              src={url}
                              alt={`Immagine ${idx + 1}`}
                              className="max-h-64 rounded-md border border-indigo-200 bg-white p-1 object-contain shadow-xs"
                              onError={(e) => { e.target.style.display = 'none'; }}
                            />
                            <a
                              href={url}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="inline-flex items-center gap-1.5 text-xs text-indigo-700 hover:text-indigo-900 hover:underline break-all transition-colors font-medium"
                            >
                              <span>🔗</span>
                              <span>{url.startsWith('data:') ? 'Apri immagine a schermo intero' : url}</span>
                            </a>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                {/* Footer (Fisso in basso) */}
                <div className="flex justify-end pt-3 border-t border-sky-100 shrink-0 mt-3">
                  <button onClick={() => setSelectedItem(null)} className="px-4 py-1.5 bg-sky-600 hover:bg-sky-700 text-white rounded-md text-xs font-bold transition-colors">Chiudi</button>
                </div>
              </div>
            </div>
          )}

          {/* 4/5-STEP WIZARD MODAL */}
          {isWizardOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white border border-sky-300 rounded-md max-w-xl w-full max-h-[90vh] flex flex-col p-6 shadow-2xl">
                
                {/* WIZARD HEADER */}
                <div className="flex justify-between items-center border-b border-sky-200 pb-3">
                  <div>
                    <span className="text-xs font-extrabold text-sky-800 uppercase tracking-wider">PASSO {wStep} DI {wType === 'theorem' ? 5 : 4}</span>
                    <h3 className="text-lg font-bold text-[#0b192c]">
                      {editingItemId ? 'Modifica Elemento' : 'Nuovo Inserimento nel Database'}
                    </h3>
                  </div>
                  <button onClick={() => setIsWizardOpen(false)} className="text-sky-900 font-bold text-lg">✕</button>
                </div>

                {/* SHOW ERROR ALERT ONLY IF PROCEED/SAVE IS CLICKED WITHOUT FILLING */}
                {wError && (
                  <div className="p-3 bg-rose-50 border border-rose-300 text-rose-800 rounded-md text-xs font-bold animate-fade-in flex items-center gap-2">
                    <span>⚠️</span>
                    <span>{wError}</span>
                  </div>
                )}

                {/* CORPO SCORREVOLE WIZARD */}
                <div className="overflow-y-auto flex-1 pr-1 space-y-4">
                  {/* STEP 1: TYPE BUTTONS */}
                  {wStep === 1 && (
                    <div className="space-y-3">
                      <p className="text-[#0b192c] text-xs font-bold">1. Seleziona se desideri inserire un Teorema o una Definizione:</p>
                      <div className="grid grid-cols-2 gap-4">
                        <button
                          type="button"
                          onClick={() => { setWType('definition'); setWError(''); setInvalidFields({}); }}
                          className={`p-5 rounded-md border flex flex-col items-center space-y-2 transition-all ${wType === 'definition' ? 'border-sky-600 bg-sky-100 text-sky-950 font-bold shadow-sm' : 'border-sky-200 bg-sky-50/50 text-sky-800'}`}
                        >
                          <span className="text-2xl">📘</span>
                          <span className="text-sm font-bold">Definizione</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => { setWType('theorem'); setWError(''); setInvalidFields({}); }}
                          className={`p-5 rounded-md border flex flex-col items-center space-y-2 transition-all ${wType === 'theorem' ? 'border-sky-600 bg-sky-100 text-sky-950 font-bold shadow-sm' : 'border-sky-200 bg-sky-50/50 text-sky-800'}`}
                        >
                          <span className="text-2xl">📜</span>
                          <span className="text-sm font-bold">Teorema</span>
                        </button>
                      </div>
                    </div>
                  )}

                  {/* STEP 2: CHAPTER & NAME */}
                  {wStep === 2 && (
                    <div className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-[#0b192c] mb-1">
                          Seleziona Capitolo
                        </label>
                        <select
                          value={wChapter}
                          onChange={e => {
                            setWChapter(e.target.value);
                            if (e.target.value !== 'N') {
                              setWError('');
                              setInvalidFields(prev => ({ ...prev, chapter: false }));
                            }
                          }}
                          className={`w-full bg-white border rounded-md p-2.5 text-xs font-medium transition-all ${invalidFields.chapter ? 'border-rose-500 bg-rose-50/30 text-rose-900 ring-1 ring-rose-500' : 'border-sky-300 text-[#0b192c]'}`}
                        >
                          <option value="N">N (Seleziona il capitolo...)</option>
                          {CHAPTERS.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-[#0b192c] mb-1">
                          {wType === 'definition' ? 'Nome dell\'oggetto da definire' : 'Nome del teorema'}
                        </label>
                        <input
                          type="text"
                          value={wName}
                          onChange={e => {
                            setWName(e.target.value);
                            if (e.target.value.trim()) {
                              setWError('');
                              setInvalidFields(prev => ({ ...prev, name: false }));
                            }
                          }}
                          placeholder={wType === 'definition' ? 'Es. Triangolo Isoscele' : 'Es. Teorema di Pitagora'}
                          className={`w-full bg-white border rounded-md p-2.5 text-xs font-medium transition-all ${invalidFields.name ? 'border-rose-500 bg-rose-50/30 text-rose-900 ring-1 ring-rose-500' : 'border-sky-300 text-[#0b192c]'}`}
                        />
                      </div>
                    </div>
                  )}

                  {/* STEP 3: CONTENT WITH MATH SYMBOLS TOOLBAR */}
                  {wStep === 3 && (
                    <div className="space-y-3">
                      <label className="block text-xs font-bold text-[#0b192c]">
                        {wType === 'definition' ? 'Testo della Definizione' : 'Enunciato del Teorema'}
                      </label>

                      {/* TOOLBAR SYMBOLS */}
                      <MathSymbolsToolbar
                        textareaRef={wContentRef}
                        value={wContent}
                        setValue={(val) => {
                          setWContent(val);
                          if (val.trim()) { setWError(''); setInvalidFields(prev => ({ ...prev, content: false })); }
                        }}
                      />

                      <textarea
                        ref={wContentRef}
                        value={wContent}
                        onChange={e => {
                          setWContent(e.target.value);
                          if (e.target.value.trim()) { setWError(''); setInvalidFields(prev => ({ ...prev, content: false })); }
                        }}
                        rows={5}
                        placeholder="Inserisci il testo qui..."
                        className={`w-full bg-white border rounded-md p-3 text-xs font-medium transition-all ${invalidFields.content ? 'border-rose-500 bg-rose-50/30 ring-1 ring-rose-500' : 'border-sky-300 text-[#0b192c]'}`}
                      />
                      {wContent && <div className="p-3 bg-sky-50 border border-sky-200 rounded-md text-xs"><MathRender content={wContent} /></div>}
                    </div>
                  )}

                  {/* STEP 4 FOR THEOREM: DIMOSTRAZIONE CON ANTEPRIMA */}
                  {wStep === 4 && wType === 'theorem' && (
                    <div className="space-y-3">
                      <label className="block text-xs font-bold text-sky-900 mb-1">
                        Dimostrazione del Teorema
                      </label>
                      
                      {/* TOOLBAR SYMBOLS FOR PROOF */}
                      <MathSymbolsToolbar
                        textareaRef={wProofRef}
                        value={wProof}
                        setValue={(val) => {
                          setWProof(val);
                          if (val.trim()) { setWError(''); setInvalidFields(prev => ({ ...prev, proof: false })); }
                        }}
                      />

                      <textarea
                        ref={wProofRef}
                        value={wProof}
                        onChange={e => {
                          setWProof(e.target.value);
                          if (e.target.value.trim()) { setWError(''); setInvalidFields(prev => ({ ...prev, proof: false })); }
                        }}
                        rows={5}
                        placeholder="Scrivi i passaggi logici della dimostrazione..."
                        className={`w-full bg-white border rounded-md p-3 text-xs font-medium transition-all ${invalidFields.proof ? 'border-rose-500 bg-rose-50/30 ring-1 ring-rose-500' : 'border-sky-300 text-[#0b192c]'}`}
                      />
                      
                      {/* LIVE MATH PREVIEW FOR PROOF */}
                      {wProof && (
                        <div className="p-3 bg-sky-50 border border-sky-200 rounded-md text-xs">
                          <h4 className="text-[10px] font-bold text-sky-900 uppercase mb-1">Anteprima Dimostrazione:</h4>
                          <MathRender content={wProof} />
                        </div>
                      )}
                    </div>
                  )}

                  {/* STEP 5 FOR THEOREM / STEP 4 FOR DEFINITION: IMAGES & OPTIONAL NOTES */}
                  {((wStep === 5 && wType === 'theorem') || (wStep === 4 && wType === 'definition')) && (
                    <div className="space-y-4 pr-1">
                      <div>
                        <label className="block text-xs font-bold text-[#0b192c] mb-1">Aggiungi Immagine (Facoltativo)</label>
                        <p className="text-[11px] text-sky-800 font-medium italic mb-2">💡 Puoi scegliere un file, incollare un link oppure incollare direttamente un'immagine dagli appunti con <strong>Cmd+V / Ctrl+V</strong>!</p>
                        <div className="space-y-2">
                          {/* File Upload Button */}
                          <div className="flex items-center gap-2">
                            <label className="flex-1 cursor-pointer bg-sky-50 hover:bg-sky-100 border border-sky-300 border-dashed rounded-md p-2.5 text-center transition-colors">
                              <span className="text-xs font-bold text-sky-900 flex items-center justify-center gap-1.5">
                                <span>📁</span>
                                <span>Carica immagine dal tuo computer</span>
                              </span>
                              <input
                                type="file"
                                accept="image/*"
                                className="hidden"
                                onChange={(e) => {
                                  const file = e.target.files?.[0];
                                  if (file) {
                                    const reader = new FileReader();
                                    reader.onload = (evt) => {
                                      if (evt.target?.result) {
                                        setWImages([...wImages, evt.target.result]);
                                      }
                                    };
                                    reader.readAsDataURL(file);
                                  }
                                  e.target.value = '';
                                }}
                              />
                            </label>
                          </div>

                          {/* Or URL input */}
                          <div className="flex gap-2">
                            <input
                              type="url"
                              placeholder="Oppure incolla un URL (https://...)"
                              id="image-url-input"
                              onKeyDown={e => {
                                if (e.key === 'Enter' && e.target.value.trim()) {
                                  e.preventDefault();
                                  e.stopPropagation();
                                  setWImages([...wImages, e.target.value.trim()]);
                                  e.target.value = '';
                                }
                              }}
                              className="flex-1 bg-white border border-sky-300 rounded-md p-2 text-xs text-[#0b192c] font-medium"
                            />
                            <button
                              type="button"
                              onClick={() => {
                                const inp = document.getElementById('image-url-input');
                                if (inp && inp.value.trim()) {
                                  setWImages([...wImages, inp.value.trim()]);
                                  inp.value = '';
                                }
                              }}
                              className="px-3 py-1.5 bg-sky-600 hover:bg-sky-700 text-white rounded-md text-xs font-bold transition-colors shrink-0"
                            >+ Aggiungi Link</button>
                          </div>
                        </div>

                        {wImages.length > 0 && (
                          <div className="mt-3 space-y-2">
                            {wImages.map((url, idx) => (
                              <div key={idx} className="flex items-center gap-2 bg-indigo-50 border border-indigo-200 rounded-md p-2">
                                {url.startsWith('data:') ? (
                                  <img src={url} alt="Anteprima" className="w-10 h-10 object-cover rounded border border-indigo-200 bg-white" />
                                ) : (
                                  <span className="text-base">🔗</span>
                                )}
                                <span className="text-xs text-indigo-700 break-all flex-1 font-medium">
                                  {url.startsWith('data:') ? `Immagine caricata dal computer (${idx + 1})` : url}
                                </span>
                                <button
                                  type="button"
                                  onClick={() => setWImages(wImages.filter((_, i) => i !== idx))}
                                  className="text-rose-500 hover:text-rose-700 text-xs font-bold shrink-0 px-1.5 py-0.5 rounded hover:bg-rose-100"
                                >✕</button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* OPTIONAL NOTES FIELD */}
                      <div>
                        <label className="block text-xs font-bold text-[#0b192c] mb-1">Note Facoltative / Osservazioni (Facoltativo)</label>
                        <textarea
                          value={wNotes}
                          onChange={e => setWNotes(e.target.value)}
                          rows={3}
                          placeholder="Aggiungi eventuali note, corollari o osservazioni personali..."
                          className="w-full bg-white border border-sky-300 rounded-md p-2.5 text-xs text-[#0b192c] font-medium"
                        />
                      </div>
                    </div>
                  )}
                </div>

                {/* FOOTER WIZARD NAVIGATION WITH CLEAN VALIDATION */}
                <div className="flex justify-between pt-3 border-t border-sky-200 shrink-0 mt-3">
                  {wStep > 1 ? (
                    <button type="button" onClick={() => { setWError(''); setInvalidFields({}); setWStep(wStep - 1); }} className="px-4 py-1.5 bg-white border border-sky-300 text-sky-900 rounded-md text-xs font-bold hover:bg-sky-100">Indietro</button>
                  ) : <div />}
                  
                  {wStep < (wType === 'theorem' ? 5 : 4) ? (
                    <button
                      type="button"
                      onClick={validateAndNextStep}
                      className="px-4 py-1.5 bg-sky-600 text-[#ffffff] font-bold rounded-md text-xs hover:bg-sky-700 shadow-sm"
                    >
                      Avanti →
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={handleSaveWizard}
                      className="px-5 py-1.5 bg-sky-700 text-[#ffffff] font-bold rounded-md text-xs hover:bg-sky-800 shadow-sm"
                    >
                      {editingItemId ? 'Salva Modifiche ✔' : 'Salva nel Database ✔'}
                    </button>
                  )}
                </div>

              </div>
            </div>
          )}

          {/* AUTHENTICATOR CONFIRMATION MODAL */}
          <AuthConfirmModal
            isOpen={authModal.isOpen}
            onClose={() => setAuthModal(prev => ({ ...prev, isOpen: false }))}
            onConfirm={() => {
              const cb = authModal.onConfirm;
              setAuthModal(prev => ({ ...prev, isOpen: false }));
              if (cb) cb();
            }}
            actionTitle={authModal.actionTitle}
            actionDescription={authModal.actionDescription}
          />

          {/* SITE NOTIFICATION & CONFIRMATION POPUP */}
          <SiteModal config={modalConfig} onClose={() => setModalConfig(null)} />

          {/* GLOBAL FOOTER */}
          <GlobalFooter />
        </div>
      );
    }

    // Redirect if user arrived with legacy test tab query or hash
    if (window.location.search.includes('tab=test') || window.location.hash === '#test') {
      window.location.replace('/test');
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
