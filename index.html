<!DOCTYPE html>
<html lang="it" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geometria</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          animation: { 'fade-in': 'fadeIn 0.2s ease-out forwards' }
        }
      }
    }
  </script>

  <!-- Google Fonts & KaTeX CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

  <!-- React 18, ReactDOM, Babel & KaTeX JS & Canvas Confetti -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background-color: #ffffff;
      background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.15) 1px, transparent 1px);
      background-size: 28px 28px;
      color: #0b192c;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #e0f2fe; }
    ::-webkit-scrollbar-thumb { background: #7dd3fc; border-radius: 4px; }
    .katex { color: #0b192c !important; font-size: 1.05em; }
    .katex-display { margin: 0.5em 0; overflow-x: auto; }
  </style>
</head>
<body class="antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // CHAPTERS DATA: Clean short names G1, G2 ... G16
    const CHAPTERS = Array.from({ length: 16 }, (_, i) => `G${i + 1}`);

    // CODE GENERATION HELPER
    const generateItemCode = (chapter, type) => {
      const typeChar = type === 'theorem' ? 'T' : 'D';
      const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let randomCode = '';
      for (let i = 0; i < 6; i++) {
        randomCode += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return `${chapter}-${typeChar}-${randomCode}`;
    };

    // 9 TOP COMMON MATH SYMBOLS FOR GEOMETRY
    const TOP_9_SYMBOLS = [
      { label: '∠', code: '$\\angle$' },
      { label: '≅', code: '$\\cong$' },
      { label: '⊥', code: '$\\perp$' },
      { label: '∥', code: '$\\parallel$' },
      { label: 'α', code: '$\\alpha$' },
      { label: 'β', code: '$\\beta$' },
      { label: 'γ', code: '$\\gamma$' },
      { label: 'π', code: '$\\pi$' },
      { label: '△', code: '$\\triangle$' }
    ];

    // EXTENDED MATH SYMBOLS LIST FOR EXPANDED PALETTE
    const EXTENDED_SYMBOLS = [
      { label: 'θ', code: '$\\theta$' },
      { label: 'σ', code: '$\\sigma$' },
      { label: '≈', code: '$\\approx$' },
      { label: '≠', code: '$\\neq$' },
      { label: '≤', code: '$\\le$' },
      { label: '≥', code: '$\\ge$' },
      { label: '→', code: '$\\rightarrow$' },
      { label: '↔', code: '$\\leftrightarrow$' },
      { label: '·', code: '$\\cdot$' },
      { label: '×', code: '$\\times$' },
      { label: '÷', code: '$\\div$' },
      { label: '∈', code: '$\\in$' },
      { label: '∉', code: '$\\notin$' },
      { label: '∀', code: '$\\forall$' },
      { label: '∃', code: '$\\exists$' },
      { label: '∞', code: '$\\infty$' },
      { label: '√x', code: '$\\sqrt{x}$' },
      { label: 'a/b', code: '$\\frac{a}{b}$' },
      { label: 'x²', code: '$x^2$' },
      { label: 'xₙ', code: '$x_n$' },
      { label: 'AB̄', code: '$\\overline{AB}$' }
    ];

    // STORAGE & MIGRATION LOGIC
    const INITIAL_DATA = [];
    const STORAGE_KEY = 'geometria_db_main';

    const getStoredItems = () => {
      try {
        const mainData = localStorage.getItem(STORAGE_KEY);
        if (mainData) {
          const items = JSON.parse(mainData);
          return items.map(item => ({
            ...item,
            code: item.code || generateItemCode(item.chapter, item.type)
          }));
        }

        const oldKeys = ['geometria_db_v7', 'geometria_db_v6', 'geometria_db_v5', 'geometria_db_v4', 'geometria_db_v3', 'geometria_db_v2_empty', 'geometria_db_v1'];
        for (const oldKey of oldKeys) {
          const oldData = localStorage.getItem(oldKey);
          if (oldData) {
            const parsed = JSON.parse(oldData);
            if (Array.isArray(parsed) && parsed.length > 0) {
              const migrated = parsed.map(item => ({
                ...item,
                code: item.code || generateItemCode(item.chapter, item.type)
              }));
              localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
              return migrated;
            }
          }
        }
        return INITIAL_DATA;
      } catch(e) { return INITIAL_DATA; }
    };

    // SUPABASE CLIENT HELPER
    const getSupabaseClient = () => {
      try {
        const url = (typeof process !== 'undefined' && process.env?.VITE_SUPABASE_URL) || window.VITE_SUPABASE_URL || localStorage.getItem('VITE_SUPABASE_URL') || "https://ybpvdijjxrtarhkkqptt.supabase.co";
        const key = (typeof process !== 'undefined' && process.env?.VITE_SUPABASE_ANON_KEY) || window.VITE_SUPABASE_ANON_KEY || localStorage.getItem('VITE_SUPABASE_ANON_KEY') || "sb_publishable_MCO5-bhukiy1pjoUotfKDg_mbfUxItY";
        if (window.supabase && url && key) {
          return window.supabase.createClient(url, key);
        }
      } catch(e){}
      return null;
    };

    // DIRECT DISK & SUPABASE CLOUD SAVING VIA API SERVER (NO DOWNLOAD PROMPT NEEDED!)
    const saveStoredItems = async (items) => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch(e){}

      // Save to Supabase Cloud Database (if active)
      const sp = getSupabaseClient();
      if (sp) {
        try {
          await sp.from('items').upsert(items);
        } catch(e){}
      }

      // Send direct write request to local server (if active)
      fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(items)
      }).catch(() => {});
    };

    // MATH RENDER COMPONENT
    const MathRender = ({ content, className = '' }) => {
      if (!content) return null;
      
      const parseMath = (text) => {
        const parts = [];
        let lastIdx = 0;
        const regex = /\$\$(.*?)\$\$|\$(.*?)\$/g;
        let m;
        while ((m = regex.exec(text)) !== null) {
          if (m.index > lastIdx) parts.push({ type: 'text', value: text.substring(lastIdx, m.index) });
          if (m[1] !== undefined) parts.push({ type: 'math', value: m[1], display: true });
          else if (m[2] !== undefined) parts.push({ type: 'math', value: m[2], display: false });
          lastIdx = regex.lastIndex;
        }
        if (lastIdx < text.length) parts.push({ type: 'text', value: text.substring(lastIdx) });
        return parts;
      };

      return (
        <div className={`whitespace-pre-wrap ${className}`}>
          {parseMath(content).map((p, idx) => {
            if (p.type === 'math') {
              try {
                const html = katex.renderToString(p.value, { displayMode: p.display, throwOnError: false });
                return <span key={idx} dangerouslySetInnerHTML={{ __html: html }} />;
              } catch(e) { return <code key={idx}>${p.value}$</code>; }
            }
            const formatted = p.value.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>');
            return <span key={idx} dangerouslySetInnerHTML={{ __html: formatted }} />;
          })}
        </div>
      );
    };

    // TOOLBAR MATH SYMBOLS INSERTION COMPONENT
    const MathSymbolsToolbar = ({ textareaRef, value, setValue }) => {
      const [showExtended, setShowExtended] = useState(false);

      const handleInsert = (symbolCode) => {
        if (!textareaRef.current) {
          setValue(value + symbolCode);
          return;
        }
        const el = textareaRef.current;
        const start = el.selectionStart || 0;
        const end = el.selectionEnd || 0;
        const newValue = value.substring(0, start) + symbolCode + value.substring(end);
        setValue(newValue);

        setTimeout(() => {
          el.focus();
          const newPos = start + symbolCode.length;
          el.setSelectionRange(newPos, newPos);
        }, 10);
      };

      return (
        <div className="space-y-1.5 mb-2">
          <div className="flex flex-wrap items-center gap-1 bg-sky-100/70 p-1.5 rounded-md border border-sky-300">
            <span className="text-[10px] font-bold text-sky-900 uppercase tracking-wider mr-1">Inserisci Simbolo:</span>
            {TOP_9_SYMBOLS.map((s, idx) => (
              <button
                key={idx}
                type="button"
                onClick={() => handleInsert(s.code)}
                title={`Inserisci ${s.code}`}
                className="w-7 h-7 bg-white hover:bg-sky-600 hover:text-white border border-sky-300 rounded text-xs font-bold text-[#0b192c] transition-all flex items-center justify-center shadow-2xs active:scale-95"
              >
                {s.label}
              </button>
            ))}

            <button
              type="button"
              onClick={() => setShowExtended(!showExtended)}
              className="px-2 py-1 bg-sky-700 hover:bg-sky-800 text-white rounded text-[11px] font-bold transition-all ml-auto flex items-center gap-1 shadow-2xs"
            >
              <span>{showExtended ? 'Chiudi' : 'Altri Simboli'}</span>
              <span>{showExtended ? '▲' : '▼'}</span>
            </button>
          </div>

          {/* EXPANDED SYMBOLS POPUP PANEL */}
          {showExtended && (
            <div className="p-2 bg-white border border-sky-300 rounded-md shadow-md grid grid-cols-7 gap-1 animate-fade-in">
              {EXTENDED_SYMBOLS.map((s, idx) => (
                <button
                  key={idx}
                  type="button"
                  onClick={() => handleInsert(s.code)}
                  title={`Inserisci ${s.code}`}
                  className="py-1 px-1.5 bg-sky-50 hover:bg-sky-600 hover:text-white border border-sky-200 rounded text-xs font-bold text-sky-950 transition-all text-center"
                >
                  {s.label}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    };

    // EQUILATERAL TRIANGLE MENU BUTTON COMPONENT (OUTLINED TRIANGLE ICON)
    const TriangleMenu = ({ onEdit, onDelete }) => {
      const [open, setOpen] = useState(false);

      return (
        <div className="relative inline-block text-left" onClick={(e) => e.stopPropagation()}>
          <button
            type="button"
            onClick={() => setOpen(!open)}
            title="Menu Opzioni"
            className="w-7 h-7 bg-white border border-sky-300 hover:bg-sky-100 text-sky-700 rounded-md flex items-center justify-center transition-all shadow-sm"
          >
            <svg viewBox="0 0 24 24" className="w-4 h-4">
              <polygon points="12,4 21,19 3,19" fill="none" stroke="#0284c7" strokeWidth="2.2" strokeLinejoin="round" />
            </svg>
          </button>

          {open && (
            <div className="absolute right-0 mt-1 w-32 bg-white border border-sky-300 rounded-md shadow-lg z-30 py-1 animate-fade-in">
              <button
                type="button"
                onClick={() => {
                  setOpen(false);
                  onEdit();
                }}
                className="w-full text-left px-3 py-1.5 text-xs font-bold text-sky-900 hover:bg-sky-50 flex items-center gap-2 border-b border-sky-100"
              >
                <span>✏️</span> Modifica
              </button>
              <button
                type="button"
                onClick={() => {
                  setOpen(false);
                  onDelete();
                }}
                className="w-full text-left px-3 py-1.5 text-xs font-bold text-rose-600 hover:bg-rose-50 flex items-center gap-2"
              >
                <span>🗑️</span> Elimina
              </button>
            </div>
          )}
        </div>
      );
    };

    // MAIN APP COMPONENT
    function App() {
      const [items, setItems] = useState([]);
      const [activeTab, setActiveTab] = useState('catalog');
      const [isWizardOpen, setIsWizardOpen] = useState(false);
      const [editingItemId, setEditingItemId] = useState(null);
      const [dataLoaded, setDataLoaded] = useState(false);
      
      // Catalog filters
      const [typeFilter, setTypeFilter] = useState('all');
      const [chapterFilter, setChapterFilter] = useState('all');
      const [search, setSearch] = useState('');
      const [selectedItem, setSelectedItem] = useState(null);

      // Wizard State (4 Steps) - DEFAULT CHAPTER IS 'N'
      const [wStep, setWStep] = useState(1);
      const [wType, setWType] = useState('definition');
      const [wChapter, setWChapter] = useState('N');
      const [wName, setWName] = useState('');
      const [wContent, setWContent] = useState('');
      const [wProof, setWProof] = useState('');
      const [wNotes, setWNotes] = useState('');
      const [wImages, setWImages] = useState([]);
      
      // VALIDATION ERRORS
      const [wError, setWError] = useState('');
      const [invalidFields, setInvalidFields] = useState({});

      // REFS FOR TEXTAREAS
      const wContentRef = useRef(null);
      const wProofRef = useRef(null);

      // Test State
      const [testChapters, setTestChapters] = useState([]);
      const [activeTestMode, setActiveTestMode] = useState(null);

      const handleStartTest = (mode) => {
        if (testChapters.length === 0) {
          alert('Seleziona almeno 1 capitolo per eseguire il test!');
          return;
        }

        const confirmed = confirm(
          "APPRENDIMENTO AUTOMATICO (MACHINE LEARNING):\n\nDurante questo test è attivo un sistema di intelligenza artificiale che impara dalle tue risposte per calibrare le verifiche future.\n\nÈ fondamentale essere onesti e sinceri nel confermare se la risposta data è corretta o sbagliata.\n\nContinuando dichiari di impegnarti a valutare le tue risposte con la massima sincerità."
        );
        if (!confirmed) return;

        setActiveTestMode(mode);
      };

      // LOAD DATA ON STARTUP: Supabase Cloud DB first → Server API → data.json fallback → localStorage
      useEffect(() => {
        const loadData = async () => {
          // 0. Try Supabase Cloud Database (if credentials configured)
          const sp = getSupabaseClient();
          if (sp) {
            try {
              const { data, error } = await sp.from('items').select('*');
              if (!error && Array.isArray(data) && data.length > 0) {
                setItems(data);
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
                setDataLoaded(true);
                return;
              }
            } catch(e) {}
          }

          // 1. Try server API (when running via node server.js)
          try {
            const res = await fetch('/api/data');
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              setItems(data);
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
              setDataLoaded(true);
              return;
            }
          } catch(e) {}

          // 2. Try data.json file directly (when opened as file://)
          try {
            const res = await fetch('./data.json');
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              setItems(data);
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
              setDataLoaded(true);
              return;
            }
          } catch(e) {}

          // 3. Last resort: localStorage
          const stored = getStoredItems();
          if (stored.length > 0) {
            setItems(stored);
          }
          setDataLoaded(true);
        };
        loadData();
      }, []);

      const resetWizard = () => {
        setWStep(1); setWType('definition'); setWChapter('N');
        setWName(''); setWContent(''); setWProof(''); setWNotes(''); setWImages([]); 
        setWError(''); setInvalidFields({});
        setEditingItemId(null);
      };

      // KEYBOARD SHORTCUT: Press 'N' or 'n' when on Home
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.key === 'n' || e.key === 'N') && activeTab === 'catalog') {
            const activeEl = document.activeElement;
            const isTyping = activeEl && (
              ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeEl.tagName) || 
              activeEl.isContentEditable
            );
            if (!isTyping && !isWizardOpen) {
              e.preventDefault();
              handleOpenCreate();
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [activeTab, isWizardOpen]);

      const filteredItems = useMemo(() => {
        return items.filter(item => {
          if (typeFilter === 'theorem' && item.type !== 'theorem') return false;
          if (typeFilter === 'definition' && item.type !== 'definition') return false;
          if (chapterFilter !== 'all' && item.chapter !== chapterFilter) return false;
          if (search.trim()) {
            const q = search.toLowerCase().trim();
            const matchesName = item.name && item.name.toLowerCase().includes(q);
            const matchesContent = item.content && item.content.toLowerCase().includes(q);
            const matchesCode = item.code && item.code.toLowerCase().includes(q);
            if (!matchesName && !matchesContent && !matchesCode) return false;
          }
          return true;
        });
      }, [items, typeFilter, chapterFilter, search]);

      const handleOpenCreate = () => {
        const confirmed = confirm(
          "⚠️ NUOVO INSERIMENTO:\n\nConfermi di voler aggiungere un nuovo elemento al database?\n\nTi chiediamo di inserire solo informazioni accurate, verificate e pertinenti alla geometria.\n\nContinuando accetti e sei l'unico responsabile di quello che fai."
        );
        if (!confirmed) return;
        resetWizard();
        setIsWizardOpen(true);
      };

      const handleOpenEdit = (item) => {
        const confirmed = confirm(
          "⚠️ MODIFICA CONTENUTO:\n\nConfermi di voler modificare questo elemento per migliorarne o correggerne i contenuti?\n\nTi chiediamo di mantenere il database accurato e di inserire solo informazioni verificate e pertinenti.\n\nContinuando accetti e sei l'unico responsabile di quello che fai."
        );
        if (!confirmed) return;

        setEditingItemId(item.id);
        setWType(item.type);
        setWChapter(item.chapter || 'N');
        setWName(item.name);
        setWContent(item.content);
        setWProof(item.proof || '');
        setWNotes(item.notes || '');
        setWImages(item.images || []);
        setWError(''); setInvalidFields({});
        setWStep(1);
        setIsWizardOpen(true);
      };

      const validateAndNextStep = () => {
        setWError('');
        const newInvalid = {};

        if (wStep === 1) {
          if (!wType) {
            setWError('Seleziona il tipo (Teorema o Definizione).');
            return;
          }
          setInvalidFields({});
          setWStep(2);
        } else if (wStep === 2) {
          if (wChapter === 'N') newInvalid.chapter = true;
          if (!wName.trim()) newInvalid.name = true;

          if (Object.keys(newInvalid).length > 0) {
            setInvalidFields(newInvalid);
            if (newInvalid.chapter && newInvalid.name) {
              setWError('Seleziona un capitolo valido (G1-G16) e inserisci il nome.');
            } else if (newInvalid.chapter) {
              setWError('Seleziona un capitolo valido da G1 a G16.');
            } else {
              setWError('Inserisci il nome dell\'oggetto prima di proseguire.');
            }
            return;
          }
          setInvalidFields({});
          setWStep(3);
        } else if (wStep === 3) {
          if (!wContent.trim()) {
            setInvalidFields({ content: true });
            setWError('Inserisci il testo/enunciato prima di proseguire.');
            return;
          }
          setInvalidFields({});
          if (wType === 'theorem') {
            setWStep(4);
          } else {
            setWStep(4); // For definition, step 4 is images & notes
          }
        } else if (wStep === 4 && wType === 'theorem') {
          if (!wProof.trim()) {
            setInvalidFields({ proof: true });
            setWError('La dimostrazione è obbligatoria per i teoremi prima di proseguire.');
            return;
          }
          setInvalidFields({});
          setWStep(5);
        }
      };

      const handleSaveWizard = () => {
        setWError('');
        const newInvalid = {};

        if (wChapter === 'N') newInvalid.chapter = true;
        if (!wName.trim()) newInvalid.name = true;
        if (!wContent.trim()) newInvalid.content = true;
        if (wType === 'theorem' && !wProof.trim()) newInvalid.proof = true;

        if (Object.keys(newInvalid).length > 0) {
          setInvalidFields(newInvalid);
          if (newInvalid.chapter || newInvalid.name) {
            setWError('Compila tutti i campi obbligatori contrassegnati.');
            setWStep(2);
          } else if (newInvalid.content) {
            setWError('Inserisci il testo/enunciato.');
            setWStep(3);
          } else if (newInvalid.proof) {
            setWError('La dimostrazione è obbligatoria per i teoremi.');
            setWStep(4);
          }
          return;
        }

        let updated;
        if (editingItemId) {
          updated = items.map(item => {
            if (item.id === editingItemId) {
              const codeChanged = item.chapter !== wChapter || item.type !== wType;
              return {
                ...item,
                type: wType,
                chapter: wChapter,
                name: wName.trim(),
                content: wContent.trim(),
                proof: wType === 'theorem' ? wProof.trim() : '',
                notes: wNotes.trim(),
                images: wImages,
                code: codeChanged ? generateItemCode(wChapter, wType) : (item.code || generateItemCode(wChapter, wType))
              };
            }
            return item;
          });
        } else {
          const newItem = {
            id: 'custom-' + Date.now(),
            code: generateItemCode(wChapter, wType),
            type: wType,
            chapter: wChapter,
            name: wName.trim(),
            content: wContent.trim(),
            proof: wType === 'theorem' ? wProof.trim() : '',
            notes: wNotes.trim(),
            images: wImages
          };
          updated = [newItem, ...items];
        }

        setItems(updated);
        saveStoredItems(updated);
        setIsWizardOpen(false);
        resetWizard();
      };

      // ENTER KEYPRESS WIZARD STEP ADVANCEMENT
      useEffect(() => {
        if (!isWizardOpen) return;
        
        const handleWizardEnter = (e) => {
          if (e.key === 'Enter') {
            const activeEl = document.activeElement;
            if (activeEl && activeEl.tagName === 'TEXTAREA') return;
            if (activeEl && activeEl.id === 'image-url-input') return;

            e.preventDefault();
            const totalSteps = wType === 'theorem' ? 5 : 4;
            if (wStep < totalSteps) {
              validateAndNextStep();
            } else {
              handleSaveWizard();
            }
          }
        };

        window.addEventListener('keydown', handleWizardEnter);
        return () => window.removeEventListener('keydown', handleWizardEnter);

          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            if (item.type.indexOf('image') !== -1) {
              const file = item.getAsFile();
              if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                  if (evt.target?.result) {
                    setWImages(prev => [...prev, evt.target.result]);
                  }
                };
                reader.readAsDataURL(file);
              }
            }
          }
        };

        window.addEventListener('paste', handlePaste);
        return () => window.removeEventListener('paste', handlePaste);
      }, [isWizardOpen]);

        if (!confirmed) return;

        const updated = items.filter(i => i.id !== id);
        setItems(updated);
        saveStoredItems(updated);
        if (selectedItem && selectedItem.id === id) setSelectedItem(null);

        // Delete from Supabase Cloud Database

                        <label className="block text-xs font-bold text-[#0b192c] mb-1">Aggiungi Immagine (Facoltativo)</label>
                        <p className="text-[11px] text-sky-800 font-medium italic mb-2">💡 Puoi scegliere un file, incollare un link oppure incollare direttamente un'immagine dagli appunti con <strong>Cmd+V / Ctrl+V</strong>!</p>
                        <div className="space-y-2">

                          <div className="flex items-center gap-2">

                              <input

                            <input

                              onKeyDown={e => {

                                  e.stopPropagation();

                              className="flex-1 bg-white border border-sky-300 rounded-md p-2 text-xs text-[#0b192c] font-medium"

                            <button

                              onClick={() => {
                                const inp = document.getElementById('image-url-input');

                                  setWImages([...wImages, inp.value.trim()]);
                                  inp.value = '';

                              className="px-3 py-1.5 bg-sky-600 hover:bg-sky-700 text-white rounded-md text-xs font-bold transition-colors shrink-0"
                            >+ Aggiungi Link</button>
                          </div>

                        {wImages.length > 0 && (

                                ) : (
                                  <span className="text-base">🔗</span>
                                )}
                                <span className="text-xs text-indigo-700 break-all flex-1 font-medium">
                                  {url.startsWith('data:') ? `Immagine caricata dal computer (${idx + 1})` : url}
                                </span>
                                <button
                                  type="button"
                                  onClick={() => setWImages(wImages.filter((_, i) => i !== idx))}
                                  className="text-rose-500 hover:text-rose-700 text-xs font-bold shrink-0 px-1.5 py-0.5 rounded hover:bg-rose-100"
                                >✕</button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* OPTIONAL NOTES FIELD */}
                      <div>
                        <label className="block text-xs font-bold text-[#0b192c] mb-1">Note Facoltative / Osservazioni (Facoltativo)</label>
                        <textarea
                          value={wNotes}
                          onChange={e => setWNotes(e.target.value)}
                          rows={3}
                          placeholder="Aggiungi eventuali note, corollari o osservazioni personali..."
                          className="w-full bg-white border border-sky-300 rounded-md p-2.5 text-xs text-[#0b192c] font-medium"
                        />
                      </div>
                    </div>
                  )}
                </div>

                {/* FOOTER WIZARD NAVIGATION WITH CLEAN VALIDATION */}
                <div className="flex justify-between pt-3 border-t border-sky-200 shrink-0 mt-3">
                  {wStep > 1 ? (
                    <button type="button" onClick={() => { setWError(''); setInvalidFields({}); setWStep(wStep - 1); }} className="px-4 py-1.5 bg-white border border-sky-300 text-sky-900 rounded-md text-xs font-bold hover:bg-sky-100">Indietro</button>
                  ) : <div />}
                  
                  {wStep < (wType === 'theorem' ? 5 : 4) ? (
                    <button
                      type="button"
                      onClick={validateAndNextStep}
                      className="px-4 py-1.5 bg-sky-600 text-[#ffffff] font-bold rounded-md text-xs hover:bg-sky-700 shadow-sm"
                    >
                      Avanti →
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={handleSaveWizard}
                      className="px-5 py-1.5 bg-sky-700 text-[#ffffff] font-bold rounded-md text-xs hover:bg-sky-800 shadow-sm"

                      {editingItemId ? 'Salva Modifiche ✔' : 'Salva nel Database ✔'}

              </div>

          )}

          {/* FOOTER CREDITI */}
          <footer className="mt-16 pb-6 text-center">
            <div className="max-w-7xl mx-auto px-4">
              <div className="border-t border-sky-100 pt-5">
                <p className="text-[11px] text-sky-400 font-medium">
                  Progettato e programmato con sofferenza da <a href="https://www.instagram.com/ballarik99/#" target="_blank" rel="noopener noreferrer" className="font-bold text-sky-500 hover:text-sky-600 hover:underline transition-colors">BallaRik</a>
                </p>
                <p className="text-[10px] text-sky-300 mt-1.5 italic">
                  Nessun triangolo è stato maltrattato durante lo sviluppo
                </p>
                <p className="text-[10px] text-sky-300 mt-1.5">
                  © 2026 R.B. | v1.2 settembre 2026
                </p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // TEST RUNNER COMPONENT
    function TestRunner({ mode, items, onFinish }) {
      // ====== MATCHING MODE ======
      const [shuffledRight, setShuffledRight] = useState([]);
      const [selLeft, setSelLeft] = useState(null);
      const [selRight, setSelRight] = useState(null);
      const [connections, setConnections] = useState({}); // leftId -> rightId
      const [matchResults, setMatchResults] = useState(null); // null = not verified yet

      // ====== WRITE MODES ======
      const [currentIdx, setCurrentIdx] = useState(0);
      const [userText, setUserText] = useState('');
      const [revealed, setRevealed] = useState(false);
      const [selfScore, setSelfScore] = useState(null); // 'correct' | 'wrong' | null
      const [answers, setAnswers] = useState([]); // {itemId, userText, score}

      // ====== FINAL SCORE SCREEN ======
      const [showScore, setShowScore] = useState(false);
      const [finalScore, setFinalScore] = useState({ correct: 0, total: 0 });

      // ====== ML LEARNING STATE ======
      const [learningData, setLearningData] = useState({});
      const [learningLoaded, setLearningLoaded] = useState(false);
      const [autoVerdict, setAutoVerdict] = useState(null);
      const [verdictConfirmed, setVerdictConfirmed] = useState(false);
      const [mlReason, setMlReason] = useState('');
      const [mlConfidence, setMlConfidence] = useState(0);

      // Load learning data from Supabase or server on mount
      useEffect(() => {
        const loadLearning = async () => {
          const sp = getSupabaseClient();
          if (sp) {
            try {
              const { data, error } = await sp.from('learning').select('*');
              if (!error && Array.isArray(data) && data.length > 0) {
                const map = {};
                data.forEach(row => { map[row.item_id] = row; });
                setLearningData(map);
                setLearningLoaded(true);
                return;
              }
            } catch(e){}
          }

          fetch('/api/learning')
            .then(r => r.json())
            .then(data => { if (data && typeof data === 'object') setLearningData(data); })
            .catch(() => {})
            .finally(() => setLearningLoaded(true));
        };
        loadLearning();
      }, []);

      const activeList = useMemo(() => {
        if (mode === 'write_definition' || mode === 'matching') return items.filter(i => i.type === 'definition');
        if (mode === 'write_theorem' || mode === 'prove_theorem') return items.filter(i => i.type === 'theorem');
        return items;
      }, [items, mode]);

      // Shuffle right side once on mount for matching
      useEffect(() => {
        if (mode === 'matching') {
          const shuffled = [...activeList].sort(() => Math.random() - 0.5);
          setShuffledRight(shuffled);
        }
      }, [mode]);

      const currentItem = activeList[currentIdx] || activeList[0];

      if (!activeList || activeList.length === 0) {
        return (
          <div className="p-8 text-center bg-sky-50 border border-sky-200 rounded-md text-sky-900 font-medium text-xs">
            Nessun contenuto presente nei capitoli selezionati per eseguire questo test. Inserisci prima dei teoremi/definizioni dal menù dedicato.
          </div>
        );
      }

      // ====== FINAL SCORE SCREEN ======
      if (showScore) {
        const pct = finalScore.total > 0 ? Math.round((finalScore.correct / finalScore.total) * 100) : 0;
        const emoji = pct === 100 ? '🏆' : pct >= 70 ? '👏' : pct >= 50 ? '💪' : '📚';
        const msg = pct === 100 ? 'Perfetto! Hai risposto correttamente a tutto!' : pct >= 70 ? 'Ottimo lavoro! Hai fatto un buon risultato.' : pct >= 50 ? 'Sufficiente. Ripassare qualcosa potrebbe aiutare.' : 'Serve ancora un po\' di studio. Non mollare!';

        if (pct === 100) try { confetti({ particleCount: 200, spread: 100 }); } catch(e) {}

        return (
          <div className="bg-white border border-sky-200 rounded-md p-8 max-w-lg mx-auto shadow-lg text-center space-y-5">
            <div className="text-6xl">{emoji}</div>
            <h2 className="text-2xl font-black text-[#0b192c]">Risultato Test</h2>
            <div className="bg-sky-50 border border-sky-200 rounded-md p-6">
              <div className="text-5xl font-black text-sky-700">{pct}%</div>
              <p className="text-sm font-bold text-[#0b192c] mt-2">{finalScore.correct} / {finalScore.total} corrette</p>
            </div>
            <p className="text-sm text-slate-700">{msg}</p>
            <button onClick={onFinish} className="px-6 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-md text-sm transition-colors">Torna ai Test</button>
          </div>
        );
      }

      // ====== MATCHING MODE ======
      if (mode === 'matching') {
        const leftConnected = Object.keys(connections);
        const rightConnected = Object.values(connections);

        const handleLeftClick = (item) => {
          if (matchResults) return; // already verified
          if (selLeft?.id === item.id) { setSelLeft(null); return; }
          setSelLeft(item);
          // If right is already selected, make connection
          if (selRight) {
            // Remove any existing connection for this left or right
            const newConn = { ...connections };
            Object.keys(newConn).forEach(k => { if (newConn[k] === selRight.id) delete newConn[k]; });
            delete newConn[item.id];
            newConn[item.id] = selRight.id;
            setConnections(newConn);
            setSelLeft(null);
            setSelRight(null);
          }
        };

        const handleRightClick = (item) => {
          if (matchResults) return;
          if (selRight?.id === item.id) { setSelRight(null); return; }
          setSelRight(item);
          // If left is already selected, make connection
          if (selLeft) {
            const newConn = { ...connections };
            Object.keys(newConn).forEach(k => { if (newConn[k] === item.id) delete newConn[k]; });
            delete newConn[selLeft.id];
            newConn[selLeft.id] = item.id;
            setConnections(newConn);
            setSelLeft(null);
            setSelRight(null);
          }
        };

        const handleVerify = () => {
          let correct = 0;
          const results = {};
          activeList.forEach(item => {
            const connectedRightId = connections[item.id];
            const isCorrect = connectedRightId === item.id;
            results[item.id] = isCorrect;
            if (isCorrect) correct++;
          });
          setMatchResults(results);
          setFinalScore({ correct, total: activeList.length });
        };

        // Find which right item is connected to a given left item
        const getConnectedRight = (leftId) => connections[leftId] || null;
        // Find which left item is connected to a given right item  
        const getConnectedLeft = (rightId) => Object.keys(connections).find(k => connections[k] === rightId) || null;

        // Connection number for display
        const getConnectionNumber = (leftId) => {
          const sorted = Object.keys(connections).sort();
          const idx = sorted.indexOf(leftId);
          return idx >= 0 ? idx + 1 : null;
        };
        const getRightConnectionNumber = (rightId) => {
          const leftId = getConnectedLeft(rightId);
          return leftId ? getConnectionNumber(leftId) : null;
        };

        return (
          <div className="bg-sky-50/90 border border-sky-200 rounded-md p-6 space-y-5 shadow-sm max-h-[85vh] overflow-y-auto">
            <div className="flex items-center justify-between">
              <h3 className="text-base font-bold text-[#0b192c]">Abbina l'Oggetto alla Definizione</h3>
              <span className="text-xs text-sky-700 font-medium">{Object.keys(connections).length} / {activeList.length} collegati</span>
            </div>
            <p className="text-xs text-sky-800">Clicca un nome a sinistra e poi la sua definizione a destra per collegare. Quando hai finito, premi <strong>Verifica Soluzioni</strong>.</p>
            <div className="grid grid-cols-2 gap-4">
              <div className="space-y-2">
                <div className="text-xs font-bold text-sky-900 uppercase mb-1">Oggetti</div>
                {activeList.map(item => {
                  const connNum = getConnectionNumber(item.id);
                  const isSelected = selLeft?.id === item.id;
                  const isConnected = !!connections[item.id];
                  const result = matchResults?.[item.id];

                  let borderColor = 'border-sky-200';
                  let bgColor = 'bg-white';
                  if (matchResults) {
                    borderColor = result ? 'border-emerald-400' : 'border-rose-400';
                    bgColor = result ? 'bg-emerald-50' : 'bg-rose-50';
                  } else if (isSelected) {
                    borderColor = 'border-[#0369a1]'; bgColor = 'bg-[#0369a1]';
                  } else if (isConnected) {
                    borderColor = 'border-sky-400'; bgColor = 'bg-sky-100';
                  }

                  return (
                    <button
                      key={item.id}
                      onClick={() => handleLeftClick(item)}
                      className={`w-full p-3 rounded-md border text-left font-bold text-xs transition-all flex items-center gap-2 ${bgColor} ${borderColor} ${isSelected ? 'text-white' : 'text-[#0b192c]'}`}
                    >
                      {connNum && <span className="shrink-0 w-5 h-5 rounded-full bg-sky-600 text-white text-[10px] font-bold flex items-center justify-center">{connNum}</span>}
                      {matchResults && (result ? <span>✅</span> : <span>❌</span>)}
                      <span>{item.name}</span>
                    </button>
                  );
                })}
              </div>
              <div className="space-y-2">
                <div className="text-xs font-bold text-sky-900 uppercase mb-1">Definizioni</div>
                {shuffledRight.map(item => {
                  const connNum = getRightConnectionNumber(item.id);
                  const isSelected = selRight?.id === item.id;
                  const isConnected = !!getConnectedLeft(item.id);
                  // For results, find which left was connected to this right
                  const connectedLeftId = getConnectedLeft(item.id);
                  const resultForRight = matchResults && connectedLeftId ? matchResults[connectedLeftId] : null;

                  let borderColor = 'border-sky-200';
                  let bgColor = 'bg-white';
                  if (matchResults && connectedLeftId) {
                    borderColor = resultForRight ? 'border-emerald-400' : 'border-rose-400';
                    bgColor = resultForRight ? 'bg-emerald-50' : 'bg-rose-50';
                  } else if (isSelected) {
                    borderColor = 'border-[#0369a1]'; bgColor = 'bg-sky-200';
                  } else if (isConnected) {
                    borderColor = 'border-sky-400'; bgColor = 'bg-sky-100';
                  }

                  return (
                    <button
                      key={item.id}
                      onClick={() => handleRightClick(item)}
                      className={`w-full p-3 rounded-md border text-left text-xs transition-all flex items-start gap-2 ${bgColor} ${borderColor} text-[#0b192c]`}
                    >
                      {connNum && <span className="shrink-0 w-5 h-5 rounded-full bg-sky-600 text-white text-[10px] font-bold flex items-center justify-center mt-0.5">{connNum}</span>}
                      <MathRender content={item.content} />
                    </button>
                  );
                })}
              </div>
            </div>
            
            {!matchResults ? (
              <div className="flex justify-center pt-3">
                <button
                  onClick={handleVerify}
                  disabled={Object.keys(connections).length < activeList.length}
                  className="px-6 py-2.5 bg-sky-600 hover:bg-sky-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold rounded-md text-sm transition-colors"
                >Verifica Soluzioni</button>
              </div>
            ) : (
              <div className="flex justify-center pt-3">
                <button
                  onClick={() => { setShowScore(true); }}
                  className="px-6 py-2.5 bg-sky-700 hover:bg-sky-800 text-white font-bold rounded-md text-sm transition-colors"
                >Vedi Punteggio →</button>
              </div>
            )}
          </div>
        );
      }

      // Save learning data to server & Supabase
      const saveLearningData = async (newData) => {
        setLearningData(newData);

        const sp = getSupabaseClient();
        if (sp && newData && typeof newData === 'object') {
          try {
            const rows = Object.entries(newData).map(([itemId, val]) => ({
              item_id: itemId,
              score: val.score || 0,
              ease_factor: val.ease_factor || 2.5,
              interval: val.interval || 1,
              repetition: val.repetition || 0,
              history: val.history || []
            }));
            if (rows.length > 0) {
              await sp.from('learning').upsert(rows);
            }
          } catch(e){}
        }

        fetch('/api/learning', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newData)
        }).catch(() => {});
      };

      // Normalize text for comparison
      const normalizeText = (text) => {
        return text
          .toLowerCase()
          .replace(/\$[^$]*\$/g, (match) => match.replace(/\\/g, '').replace(/[{}]/g, '').replace(/\s+/g, ''))
          .replace(/[.,;:!?'"()\[\]{}]/g, '')
          .replace(/\s+/g, ' ')
          .trim();
      };

      // Dice coefficient similarity on bigrams
      const similarity = (a, b) => {
        if (a.length < 2 || b.length < 2) return a === b ? 1 : 0;
        const bigramsA = new Set();
        for (let i = 0; i < a.length - 1; i++) bigramsA.add(a.substring(i, i + 2));
        const bigramsB = new Set();
        for (let i = 0; i < b.length - 1; i++) bigramsB.add(b.substring(i, i + 2));
        let intersection = 0;
        bigramsA.forEach(bg => { if (bigramsB.has(bg)) intersection++; });
        return (2 * intersection) / (bigramsA.size + bigramsB.size);
      };

      // ML-enhanced comparison: uses learned data + adaptive threshold
      const mlCompare = (itemId, givenText, officialText) => {
        const given = normalizeText(givenText);
        const official = normalizeText(officialText);
        const itemLearning = learningData[itemId] || { accepted: [], rejected: [], threshold: 0.75 };
        const threshold = itemLearning.threshold || 0.75;

        // 1. Exact match with official text
        if (given === official) return { verdict: 'correct', confidence: 1.0, reason: 'Corrispondenza esatta con il testo ufficiale' };

        // 2. Check against previously ACCEPTED answers (learned correct phrasings)
        let bestAcceptedSim = 0;
        for (const acc of (itemLearning.accepted || [])) {
          const sim = similarity(given, acc);
          if (sim > bestAcceptedSim) bestAcceptedSim = sim;
          if (given === acc) return { verdict: 'correct', confidence: 0.95, reason: 'Corrisponde a una risposta già accettata in precedenza' };
        }

        // 3. Check against previously REJECTED answers (learned wrong phrasings)
        let bestRejectedSim = 0;
        for (const rej of (itemLearning.rejected || [])) {
          const sim = similarity(given, rej);
          if (sim > bestRejectedSim) bestRejectedSim = sim;
          if (given === rej) return { verdict: 'wrong', confidence: 0.95, reason: 'Corrisponde a una risposta già rifiutata in precedenza' };
        }

        // 4. Similarity with official text
        const officialSim = similarity(given, official);

        // 5. ML decision: weigh official similarity + learned data
        if (bestAcceptedSim > 0.85) return { verdict: 'correct', confidence: bestAcceptedSim, reason: `Molto simile a una risposta accettata (${Math.round(bestAcceptedSim * 100)}%)` };
        if (bestRejectedSim > 0.85) return { verdict: 'wrong', confidence: bestRejectedSim, reason: `Molto simile a una risposta rifiutata (${Math.round(bestRejectedSim * 100)}%)` };

        // 6. Use adaptive threshold (learned from feedback)
        const containsMatch = official.includes(given) || given.includes(official);
        if (containsMatch) return { verdict: 'correct', confidence: 0.8, reason: 'Il testo è contenuto nella risposta ufficiale (o viceversa)' };

        if (officialSim >= threshold) {
          return { verdict: 'correct', confidence: officialSim, reason: `Similarità ${Math.round(officialSim * 100)}% (soglia: ${Math.round(threshold * 100)}%)` };
        }

        return { verdict: 'wrong', confidence: 1 - officialSim, reason: `Similarità ${Math.round(officialSim * 100)}% sotto la soglia del ${Math.round(threshold * 100)}%` };
      };

      const handleCheckAnswer = () => {
        setRevealed(true);
        const result = mlCompare(currentItem.id, userText, expectedField);
        setAutoVerdict(result.verdict);
        setMlReason(result.reason);
        setMlConfidence(result.confidence);
      };

      const handleConfirmVerdict = (userAgreesWithVerdict) => {
        const finalVerdict = userAgreesWithVerdict ? autoVerdict : (autoVerdict === 'correct' ? 'wrong' : 'correct');
        setSelfScore(finalVerdict);
        setVerdictConfirmed(true);
        const newAnswers = [...answers, { itemId: currentItem.id, userText, score: finalVerdict }];
        setAnswers(newAnswers);

        // ====== ML LEARNING: update learning data based on feedback ======
        const normalizedAnswer = normalizeText(userText);
        const newLearning = { ...learningData };
        if (!newLearning[currentItem.id]) {
          newLearning[currentItem.id] = { accepted: [], rejected: [], threshold: 0.75 };
        }
        const itemData = { ...newLearning[currentItem.id] };
        const accepted = [...(itemData.accepted || [])];
        const rejected = [...(itemData.rejected || [])];

        if (finalVerdict === 'correct') {
          // Add to accepted if not already there
          if (!accepted.includes(normalizedAnswer)) accepted.push(normalizedAnswer);
          // Remove from rejected if it was there
          const rejIdx = rejected.indexOf(normalizedAnswer);
          if (rejIdx >= 0) rejected.splice(rejIdx, 1);
        } else {
          // Add to rejected if not already there
          if (!rejected.includes(normalizedAnswer)) rejected.push(normalizedAnswer);
          // Remove from accepted if it was there
          const accIdx = accepted.indexOf(normalizedAnswer);
          if (accIdx >= 0) accepted.splice(accIdx, 1);
        }

        // Adapt threshold: if the user corrected the verdict, adjust threshold
        if (!userAgreesWithVerdict) {
          const officialSim = similarity(normalizedAnswer, normalizeText(expectedField));
          if (finalVerdict === 'correct' && officialSim < itemData.threshold) {
            // User said it's correct but we said wrong → lower threshold
            itemData.threshold = Math.max(0.4, officialSim - 0.05);
          } else if (finalVerdict === 'wrong' && officialSim >= itemData.threshold) {
            // User said it's wrong but we said correct → raise threshold
            itemData.threshold = Math.min(0.95, officialSim + 0.05);
          }
        }

        itemData.accepted = accepted;
        itemData.rejected = rejected;
        newLearning[currentItem.id] = itemData;
        saveLearningData(newLearning);
      };

      const handleNext = () => {
        if (currentIdx < activeList.length - 1) {
          setCurrentIdx(currentIdx + 1);
          setUserText('');
          setRevealed(false);
          setSelfScore(null);
          setAutoVerdict(null);
          setVerdictConfirmed(false);
          setMlReason('');
          setMlConfidence(0);
        } else {
          const correct = answers.filter(a => a.score === 'correct').length;
          setFinalScore({ correct, total: activeList.length });
          setShowScore(true);
        }
      };

      const modeLabel = mode === 'write_definition' ? 'Scrivi la Definizione' : mode === 'write_theorem' ? 'Scrivi l\'Enunciato del Teorema' : 'Dimostra il Teorema';
      const expectedField = mode === 'prove_theorem' ? currentItem.proof : currentItem.content;
      const learnCount = learningData[currentItem?.id] ? ((learningData[currentItem.id].accepted || []).length + (learningData[currentItem.id].rejected || []).length) : 0;

      return (
        <div className="bg-[#f0f9ff] border border-sky-200 rounded-md p-6 space-y-5 max-w-3xl mx-auto shadow-sm max-h-[85vh] overflow-y-auto">
          <div className="border-b border-sky-200 pb-2">
            <div className="flex items-center justify-between">
              <span className="text-xs font-mono font-bold text-sky-900">Domanda {currentIdx + 1} di {activeList.length} • {currentItem.code}</span>
              <span className="text-xs text-sky-700 font-medium">{modeLabel}</span>
            </div>
            <h3 className="text-xl font-bold text-[#0b192c] mt-0.5">{currentItem.name}</h3>
          </div>

          <div className="space-y-2">
            <label className="block text-xs font-bold text-[#0b192c]">
              {mode === 'prove_theorem' ? 'Sviluppa i passaggi della dimostrazione:' : 'Scrivi la tua risposta a memoria:'}
            </label>
            <textarea
              value={userText}
              onChange={e => setUserText(e.target.value)}
              rows={5}
              disabled={revealed}
              placeholder="Scrivi qui la tua risposta..."
              className={`w-full bg-white border rounded-md p-3 text-xs text-[#0b192c] transition-all ${revealed ? 'border-slate-300 bg-slate-50' : 'border-sky-300'}`}
            />
          </div>

          {!revealed ? (
            <div className="flex justify-end">
              <button onClick={handleCheckAnswer} disabled={!userText.trim()} className="px-5 py-2 bg-sky-600 hover:bg-sky-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold rounded-md text-xs transition-colors">Verifica Risposta</button>
            </div>
          ) : (
            <div className="space-y-4 pt-4 border-t border-sky-200">
              {/* Auto verdict banner */}
              <div className={`p-4 rounded-md border-2 text-center ${autoVerdict === 'correct' ? 'bg-emerald-50 border-emerald-400' : 'bg-rose-50 border-rose-400'}`}>
                <div className="text-3xl mb-1">{autoVerdict === 'correct' ? '✅' : '❌'}</div>
                <p className={`text-sm font-bold ${autoVerdict === 'correct' ? 'text-emerald-800' : 'text-rose-800'}`}>
                  {autoVerdict === 'correct' ? 'Risposta CORRETTA!' : 'Risposta SBAGLIATA'}
                </p>
                <p className="text-[11px] text-slate-600 mt-1 italic">🤖 {mlReason}</p>
                {learnCount > 0 && (
                  <p className="text-[10px] text-violet-600 mt-1 font-medium">🧠 Apprendimento: {learnCount} risposte memorizzate per questo oggetto</p>
                )}
              </div>

              {/* Show both answers side by side */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div className="bg-slate-50 border border-slate-200 p-3 rounded-md">
                  <h4 className="text-[10px] text-slate-600 font-bold uppercase mb-1">La tua risposta</h4>
                  <p className="text-xs text-[#0b192c] whitespace-pre-wrap">{userText}</p>
                </div>
                <div className="bg-sky-50 border border-sky-200 p-3 rounded-md">
                  <h4 className="text-[10px] text-sky-900 font-bold uppercase mb-1">Risposta corretta</h4>
                  <MathRender content={expectedField} className="text-[#0b192c] text-xs" />
                </div>
              </div>

              {/* Ask if verdict is correct */}
              {!verdictConfirmed ? (
                <div className="bg-amber-50 border border-amber-300 rounded-md p-4 space-y-2.5">
                  <p className="text-xs font-bold text-amber-900">Il verdetto è giusto? Confronta le due risposte.</p>
                  <div className="flex gap-3">
                    <button onClick={() => handleConfirmVerdict(true)} className="flex-1 py-2 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-md text-xs transition-colors">👍 Sì, il verdetto è giusto</button>
                    <button onClick={() => handleConfirmVerdict(false)} className="flex-1 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-md text-xs transition-colors">👎 No, cambia il verdetto</button>
                  </div>
                </div>
              ) : (
                <div className="space-y-3">
                  <div className={`p-3 rounded-md border text-center text-sm font-bold ${selfScore === 'correct' ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-rose-50 border-rose-300 text-rose-800'}`}>
                    {selfScore === 'correct' ? '✅ Punteggio finale: CORRETTA' : '❌ Punteggio finale: SBAGLIATA'}
                  </div>
                  <div className="flex justify-end">
                    <button onClick={handleNext} className="px-5 py-2 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-md text-xs transition-colors">
                      {currentIdx < activeList.length - 1 ? 'Prossima Domanda →' : 'Vedi Punteggio →'}
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
