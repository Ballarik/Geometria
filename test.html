<!DOCTYPE html>
<html lang="it" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Area Test - Geometria</title>
  
  <!-- Favicons & App Icons -->
  <link rel="icon" href="/favicon.ico?v=1.6.3" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1.6.3">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1.6.3">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=1.6.3">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1.6.3">
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png?v=1.6.3">
  <link rel="mask-icon" href="/safari-pinned-tab.svg?v=1.6.3" color="#0ea5e9">
  <meta name="apple-mobile-web-app-title" content="geometria">
  <meta name="application-name" content="geometria">
  <meta name="theme-color" content="#ffffff">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          animation: { 'fade-in': 'fadeIn 0.2s ease-out forwards' }
        }
      }
    }
  </script>

  <!-- Google Fonts & KaTeX CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

  <!-- React 18, ReactDOM, Babel & KaTeX JS & Canvas Confetti & Supabase -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background-color: #ffffff;
      background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.15) 1px, transparent 1px);
      background-size: 28px 28px;
      color: #0b192c;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #e0f2fe; }
    ::-webkit-scrollbar-thumb { background: #7dd3fc; border-radius: 4px; }
    .katex { color: #0b192c !important; font-size: 1.05em; }
    .katex-display { margin: 0.5em 0; overflow-x: auto; }
  </style>

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const CHAPTERS = Array.from({ length: 16 }, (_, i) => `G${i + 1}`);

    const SUPABASE_CONFIG = {
      url: 'https://ybpvdijjxrtarhkkqptt.supabase.co',
      anonKey: 'sb_publishable_MCO5-bhukiy1pjoUotfKDg_mbfUxItY'
    };

    const getSupabaseClient = () => {
      try {
        const url = window.VITE_SUPABASE_URL || (typeof process !== 'undefined' && process.env?.VITE_SUPABASE_URL) || localStorage.getItem('VITE_SUPABASE_URL') || SUPABASE_CONFIG.url;
        const key = window.VITE_SUPABASE_ANON_KEY || (typeof process !== 'undefined' && process.env?.VITE_SUPABASE_ANON_KEY) || localStorage.getItem('VITE_SUPABASE_ANON_KEY') || SUPABASE_CONFIG.anonKey;
        if (window.supabase && url && key) {
          return window.supabase.createClient(url, key);
        }
      } catch(e){}
      return null;
    };

    const FolderIcon = ({ className = "w-4 h-4 text-sky-500 shrink-0" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
      </svg>
    );

    function GlobalFooter() {
      return (
        <footer className="mt-16 pb-8 text-center">
          <div className="max-w-4xl mx-auto px-4">
            <div className="border-t border-sky-200/60 pt-6 space-y-1.5 text-[11px] text-slate-500 leading-relaxed font-normal">
              <p>
                Progettato e programmato con sofferenza da <a href="https://www.instagram.com/ballarik99/#" target="_blank" rel="noopener noreferrer" className="text-sky-600 hover:text-sky-800 hover:underline">BallaRik</a> · Nessun triangolo è stato maltrattato durante lo sviluppo · v1.6.3 — Settembre 2026
              </p>
              <p>
                © 2026 Geometria — Progetto didattico indipendente, no-profit
              </p>
              <p>
                Codice sorgente: licenza <a href="/LICENSE" target="_blank" rel="noopener noreferrer" className="text-sky-600 hover:text-sky-800 hover:underline">MIT</a> · Contenuti didattici: licenza <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer" className="text-sky-600 hover:text-sky-800 hover:underline">CC BY 4.0</a>
              </p>
              <p>
                <a href="/termini" className="text-sky-600 hover:text-sky-800 hover:underline">Termini di Utilizzo</a>
              </p>
            </div>
          </div>
        </footer>
      );
    }

    function SiteModal({ config, onClose }) {
      if (!config) return null;
      return (
        <div
          className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in font-sans"
          onClick={onClose}
        >
          <div
            className="bg-white rounded-2xl max-w-md w-full p-6 sm:p-7 shadow-2xl space-y-4 text-left"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex justify-between items-start gap-4">
              <h3 className="text-lg sm:text-xl font-bold text-[#0b192c] tracking-tight">
                {config.title}
              </h3>
              <button
                type="button"
                onClick={onClose}
                className="text-slate-400 hover:text-slate-600 font-bold text-lg cursor-pointer px-1 -mr-1 -mt-1 transition-colors"
              >
                ✕
              </button>
            </div>

            <div className="space-y-2.5 text-sm text-slate-600 leading-relaxed font-normal">
              {config.message && <p>{config.message}</p>}
              {config.paragraphs && config.paragraphs.map((p, idx) => (
                <p key={idx}>{p}</p>
              ))}
            </div>

            <div className="flex items-center justify-end gap-2.5 pt-2">
              {config.type === 'confirm' && (
                <button
                  type="button"
                  onClick={config.onCancel || onClose}
                  className="px-4 py-2 text-slate-600 hover:text-[#0b192c] hover:bg-slate-100 rounded-lg text-xs font-bold transition-all cursor-pointer"
                >
                  {config.cancelText || 'Annulla'}
                </button>
              )}
              <button
                type="button"
                onClick={config.onConfirm || onClose}
                className="px-5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-lg text-xs font-bold transition-all shadow-sm cursor-pointer"
              >
                {config.confirmText || 'OK'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function TestHubApp() {
      // All chapters are unselected by default
      const [testChapters, setTestChapters] = useState([]);
      const [learningData, setLearningData] = useState({});
      const [modalConfig, setModalConfig] = useState(null);

      // Load learning stats
      useEffect(() => {
        const loadLearning = async () => {
          const sp = getSupabaseClient();
          if (sp) {
            try {
              const { data, error } = await sp.from('learning').select('*');
              if (!error && Array.isArray(data) && data.length > 0) {
                const map = {};
                data.forEach(row => {
                  const h = row.history || {};
                  map[row.item_id] = {
                    accepted: Array.isArray(h.accepted) ? h.accepted : (Array.isArray(row.accepted) ? row.accepted : []),
                    rejected: Array.isArray(h.rejected) ? h.rejected : (Array.isArray(row.rejected) ? row.rejected : [])
                  };
                });
                setLearningData(map);
                return;
              }
            } catch(e){}
          }
          try {
            const local = localStorage.getItem('geometria_learning');
            if (local) {
              const parsed = JSON.parse(local);
              if (parsed && typeof parsed === 'object') setLearningData(parsed);
            }
          } catch(e){}
        };
        loadLearning();
      }, []);

      const totalLearnedCount = useMemo(() => {
        let count = 0;
        Object.values(learningData || {}).forEach(val => {
          if (val) {
            count += (val.accepted?.length || 0) + (val.rejected?.length || 0);
          }
        });
        return count;
      }, [learningData]);

      const handleLaunchTest = (targetUrl) => {
        if (testChapters.length === 0) {
          setModalConfig({
            type: 'alert',
            category: 'ATTENZIONE',
            title: 'Nessun Capitolo Selezionato',
            message: 'Seleziona almeno 1 capitolo per poter iniziare la sessione di test.',
            confirmText: 'Ho capito',
            onConfirm: () => setModalConfig(null)
          });
          return;
        }

        setModalConfig({
          type: 'confirm',
          category: 'LINEE GUIDA TEST',
          title: 'Apprendimento Automatico (ML)',
          paragraphs: [
            'Durante questo test è attivo un sistema di intelligenza artificiale che impara dalle tue risposte per calibrare le verifiche future.',
            'È fondamentale essere onesti e sinceri nel confermare se la risposta data è corretta o sbagliata.',
            'Continuando dichiari di impegnarti a valutare le tue risposte con la massima sincerità.'
          ],
          confirmText: 'Continua e Inizia il Test',
          cancelText: 'Annulla',
          onConfirm: () => {
            try {
              localStorage.setItem('geometria_test_chapters', JSON.stringify(testChapters));
            } catch(e){}
            window.location.href = targetUrl;
          },
          onCancel: () => setModalConfig(null)
        });
      };

      return (
        <div className="min-h-screen pb-12 text-[#0b192c]">
          {/* HEADER / NAVBAR */}
          <header className="bg-white/90 border-b border-sky-200 sticky top-0 z-40 backdrop-blur-md shadow-sm">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              
              {/* LOGO */}
              <a href="/" className="flex items-center space-x-2">
                <span className="text-2xl font-bold text-sky-500 font-serif leading-none select-none">π</span>
                <h1 className="font-extrabold text-xl text-[#0b192c] tracking-tight">geometria</h1>
              </a>

              <div className="flex items-center space-x-1.5 bg-sky-50/80 p-1 rounded-md border border-sky-200">
                <a
                  href="/"
                  className="px-3 py-1.5 rounded-md text-xs font-bold text-sky-900 hover:bg-sky-100 transition-all"
                >
                  Consultazione
                </a>
                <span className="px-3 py-1.5 rounded-md text-xs font-bold bg-sky-600 text-white shadow-sm">
                  Area Test
                </span>
                <a
                  href="/machine-learning"
                  className="px-3 py-1.5 rounded-md text-xs font-bold text-sky-900 hover:bg-sky-100 transition-all flex items-center gap-1.5"
                >
                  <FolderIcon className="w-3.5 h-3.5 text-sky-600" />
                  <span className="hidden sm:inline">Archivio IA</span>
                </a>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-8 space-y-6">
            {/* CHAPTER SELECTOR */}
            <div className="bg-sky-50/90 border border-dashed border-sky-300 rounded-xl p-6 space-y-4 shadow-sm">
              <div className="flex flex-wrap justify-between items-center gap-2">
                <div>
                  <h3 className="font-bold text-[#0b192c] text-sm sm:text-base">
                    1. Seleziona i Capitoli per il Test ({testChapters.length}/16 selezionati)
                  </h3>
                  <p className="text-[11px] text-sky-800">
                    Seleziona uno o più capitoli su cui desideri effettuare il test.
                  </p>
                </div>
                <div className="flex space-x-3">
                  <button onClick={() => setTestChapters(CHAPTERS)} className="text-xs font-bold text-sky-700 hover:underline">
                    Seleziona Tutti
                  </button>
                  <button onClick={() => setTestChapters([])} className="text-xs font-bold text-slate-500 hover:underline">
                    Deseleziona Tutti
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2">
                {CHAPTERS.map(ch => {
                  const isSel = testChapters.includes(ch);
                  return (
                    <button
                      key={ch}
                      onClick={() => {
                        if (isSel) {
                          setTestChapters(testChapters.filter(id => id !== ch));
                        } else {
                          setTestChapters([...testChapters, ch]);
                        }
                      }}
                      className={`p-2.5 rounded-lg border text-center font-bold text-xs transition-all ${isSel ? 'bg-sky-600 border-sky-600 text-white shadow-sm' : 'bg-white border-sky-200 text-sky-900 hover:bg-sky-100'}`}
                    >
                      {ch}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* SEPARATE TEST & ML CARDS */}
            <div className="space-y-3">
              <h3 className="font-bold text-[#0b192c] text-sm sm:text-base">
                2. Scegli la Pagina di Verifica
              </h3>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                {/* TEST DEFINIZIONI CARD */}
                <div className="bg-white border-2 border-sky-200 hover:border-sky-500 rounded-xl p-6 shadow-sm hover:shadow-md transition-all flex flex-col justify-between space-y-4">
                  <div className="space-y-2">
                    <h4 className="text-base font-extrabold text-[#0b192c]">Test Definizioni</h4>
                    <p className="text-sky-800 text-xs leading-relaxed">
                      Dato il nome dell'oggetto geometrico, scrivi la sua definizione esatta. L'IA confronterà la tua risposta con quella attesa e registrerà il verdetto.
                    </p>
                  </div>
                  <button
                    onClick={() => handleLaunchTest('/test-definizioni')}
                    className="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs rounded-lg shadow-sm transition-colors text-center"
                  >
                    Avvia Test Definizioni →
                  </button>
                </div>

                {/* TEST TEOREMI CARD */}
                <div className="bg-white border-2 border-sky-200 hover:border-sky-500 rounded-xl p-6 shadow-sm hover:shadow-md transition-all flex flex-col justify-between space-y-4">
                  <div className="space-y-2">
                    <h4 className="text-base font-extrabold text-[#0b192c]">Test Teoremi</h4>
                    <p className="text-sky-800 text-xs leading-relaxed">
                      Dato il nome del teorema geometrico, scrivi il suo enunciato teorico formale. Verifica la correttezza della formulazione e impara con l'IA.
                    </p>
                  </div>
                  <button
                    onClick={() => handleLaunchTest('/test-teoremi')}
                    className="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs rounded-lg shadow-sm transition-colors text-center"
                  >
                    Avvia Test Teoremi →
                  </button>
                </div>

                {/* ARCHIVIO MACHINE LEARNING CARD */}
                <div className="bg-white border-2 border-sky-200 hover:border-sky-500 rounded-xl p-6 shadow-sm hover:shadow-md transition-all flex flex-col justify-between space-y-4 md:col-span-2 lg:col-span-1">
                  <div className="space-y-2">
                    <h4 className="text-base font-extrabold text-[#0b192c]">Archivio Risposte IA</h4>
                    <p className="text-sky-800 text-xs leading-relaxed">
                      Esplora il database completo delle risposte apprese dal sistema di Machine Learning. Consulta le risposte accettate e rifiutate per ciascun elemento.
                    </p>
                    <div className="pt-1">
                      <span className="inline-block bg-sky-50 border border-sky-200 text-sky-800 text-[11px] px-2.5 py-1 rounded-md font-semibold">
                        {totalLearnedCount} risposte attualmente archiviate
                      </span>
                    </div>
                  </div>
                  <a
                    href="/machine-learning"
                    className="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-lg shadow-sm transition-colors text-center block"
                  >
                    Esplora Archivio IA →
                  </a>
                </div>
              </div>
            </div>
          </main>

          <SiteModal config={modalConfig} onClose={() => setModalConfig(null)} />
          <GlobalFooter />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<TestHubApp />);
  </script>
</body>
</html>
