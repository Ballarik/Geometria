    const MathRender = ({ content, className = '' }) => {
      if (!content) return null;
      const parseMath = (text) => {
        const parts = [];
        let lastIdx = 0;
        const regex = /\$\$(.*?)\$\$|\$(.*?)\$/g;
        let m;
        while ((m = regex.exec(text)) !== null) {
          if (m.index > lastIdx) parts.push({ type: 'text', value: text.substring(lastIdx, m.index) });
          if (m[1] !== undefined) parts.push({ type: 'math', value: m[1], display: true });
          else if (m[2] !== undefined) parts.push({ type: 'math', value: m[2], display: false });
          lastIdx = regex.lastIndex;
        }
        if (lastIdx < text.length) parts.push({ type: 'text', value: text.substring(lastIdx) });
        return parts;
      };

      return (
        <div className={`whitespace-pre-wrap ${className}`}>
          {parseMath(content).map((p, idx) => {
            if (p.type === 'math') {
              try {
                const html = katex.renderToString(p.value, { displayMode: p.display, throwOnError: false });
                return <span key={idx} dangerouslySetInnerHTML={{ __html: html }} />;
              } catch(e) { return <code key={idx}>${p.value}$</code>; }
            }
            const formatted = p.value.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>');
            return <span key={idx} dangerouslySetInnerHTML={{ __html: formatted }} />;
          })}
        </div>
      );
    };

    // ==========================================
    // ADMIN AUTHENTICATOR (TOTP RFC 6238) SYSTEM
    // ==========================================
    const _AUTH_PAYLOAD = "PiInLy5aPytbWDc3WFhaK1koOygrI1gmJl4gIi4jWSs=";
    const _AUTH_K = 109;

    function getAuthSecret() {
      try {
        const raw = atob(_AUTH_PAYLOAD);
        let s = "";
        for (let i = 0; i < raw.length; i++) {
          s += String.fromCharCode(raw.charCodeAt(i) ^ _AUTH_K);
        }
        return s;
      } catch (e) {
        return "";
      }
    }

    const _B32_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
    function base32ToBytes(b32) {
      let bits = "";
      for (let i = 0; i < b32.length; i++) {
        const val = _B32_CHARS.indexOf(b32.charAt(i).toUpperCase());
        if (val === -1) continue;
        bits += val.toString(2).padStart(5, "0");
      }
      const bytes = [];
      for (let i = 0; i + 8 <= bits.length; i += 8) {
        bytes.push(parseInt(bits.substr(i, 8), 2));
      }
      return new Uint8Array(bytes);
    }

    function pureSha1(bytes) {
      let words = [];
      for (let i = 0; i < bytes.length; i++) {
        words[i >> 2] |= (bytes[i] & 0xff) << (24 - (i % 4) * 8);
      }
      const byteLen = bytes.length * 8;
      words[byteLen >> 5] |= 0x80 << (24 - (byteLen % 32));
      words[(((byteLen + 64) >> 9) << 4) + 15] = byteLen;

      let h0 = 0x67452301, h1 = 0xefcdab89, h2 = 0x98badcfe, h3 = 0x10325476, h4 = 0xc3d2e1f0;
      const w = new Int32Array(80);

      for (let i = 0; i < words.length; i += 16) {
        for (let j = 0; j < 16; j++) w[j] = words[i + j] | 0;
        for (let j = 16; j < 80; j++) {
          const n = w[j - 3] ^ w[j - 8] ^ w[j - 14] ^ w[j - 16];
          w[j] = (n << 1) | (n >>> 31);
        }
        let a = h0, b = h1, c = h2, d = h3, e = h4;
        for (let j = 0; j < 80; j++) {
          let f, k;
          if (j < 20) { f = (b & c) | ((~b) & d); k = 0x5a827999; }
          else if (j < 40) { f = b ^ c ^ d; k = 0x6ed9eba1; }
          else if (j < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8f1bbcdc; }
          else { f = b ^ c ^ d; k = 0xca62c1d6; }
          const temp = (((a << 5) | (a >>> 27)) + f + e + k + w[j]) | 0;
          e = d; d = c; c = (b << 30) | (b >>> 2); b = a; a = temp;
        }
        h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0;
      }
      const res = new Uint8Array(20);
      const hs = [h0, h1, h2, h3, h4];
      for (let i = 0; i < 5; i++) {
        res[i*4] = (hs[i] >>> 24) & 0xff;
        res[i*4+1] = (hs[i] >>> 16) & 0xff;
        res[i*4+2] = (hs[i] >>> 8) & 0xff;
        res[i*4+3] = hs[i] & 0xff;
      }
      return res;
    }

    function pureHmacSha1(key, msg) {
      let k = new Uint8Array(key);
      if (k.length > 64) k = pureSha1(k);
      const kPad = new Uint8Array(64);
      kPad.set(k);
      const ipad = new Uint8Array(64), opad = new Uint8Array(64);
      for (let i = 0; i < 64; i++) {
        ipad[i] = kPad[i] ^ 0x36;
        opad[i] = kPad[i] ^ 0x5c;
      }
      const inner = new Uint8Array(64 + msg.length);
      inner.set(ipad);
      inner.set(msg, 64);
      const innerHash = pureSha1(inner);
      const outer = new Uint8Array(64 + 20);
      outer.set(opad);
      outer.set(innerHash, 64);
      return pureSha1(outer);
    }

    function computeTotpAtStep(keyBytes, stepBigInt) {
      const msg = new Uint8Array(8);
      const view = new DataView(msg.buffer);
      view.setBigUint64(0, stepBigInt, false);
      const sig = pureHmacSha1(keyBytes, msg);
      const offset = sig[sig.length - 1] & 0x0f;
      const binary =
        ((sig[offset] & 0x7f) << 24) |
        ((sig[offset + 1] & 0xff) << 16) |
        ((sig[offset + 2] & 0xff) << 8) |
        (sig[offset + 3] & 0xff);
      return (binary % 1000000).toString().padStart(6, "0");
    }

    function verifyTotpCode(inputCode) {
      if (!inputCode || typeof inputCode !== "string") return false;
      const clean = inputCode.trim().replace(/\s+/g, "");
      if (!/^\d{6}$/.test(clean)) return false;

      const secret = getAuthSecret();
      if (!secret) return false;

      const keyBytes = base32ToBytes(secret);
      const currentStep = Math.floor(Date.now() / 1000 / 30);

      for (let offset = -1; offset <= 1; offset++) {
        const step = BigInt(currentStep + offset);
        if (computeTotpAtStep(keyBytes, step) === clean) return true;
      }
      return false;
    }

    // AUTHENTICATOR CONFIRMATION MODAL
    function AuthConfirmModal({ isOpen, onClose, onConfirm, actionTitle, actionDescription }) {

          setError('');
          setIsVerifying(false);
          setTimeout(() => { if (inputRef.current) inputRef.current.focus(); }, 80);
        }
      }, [isOpen]);

      useEffect(() => {
        if (!isOpen) return;
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen, onClose]);

        if (e) e.preventDefault();
        const clean = code.trim().replace(/\s+/g, '');

          setError('Inserisci il codice numerico completo di 6 cifre.');
          return;
        }

        setIsVerifying(true);
        setError('');

        setTimeout(() => {
          const isValid = verifyTotpCode(clean);
          if (isValid) {
            setIsVerifying(false);
            onConfirm();
          } else {
            setIsVerifying(false);
            setError('Codice errato o scaduto. Controlla l\'app Authenticator e riprova.');

            )}

            <form onSubmit={handleSubmit} className="space-y-4 pt-1">
              <div className="space-y-1.5 text-center">
                <label className="block text-xs font-bold text-[#0b192c]">
                  Codice a 6 Cifre
                </label>
                <input
                  ref={inputRef}
                  type="text"
                  inputMode="numeric"
                  pattern="[0-9]*"
                  maxLength={6}
                  autoComplete="one-time-code"
                  placeholder="000000"
                  value={code}
                  onChange={(e) => {
                    const val = e.target.value.replace(/\D/g, '').slice(0, 6);
                    setCode(val);
                    if (error) setError('');

              {error && (

              <div className="flex justify-end items-center gap-2.5 pt-3 border-t border-sky-200">

    function MachineLearningApp() {
      const [items, setItems] = useState([]);

      const [expandedChapters, setExpandedChapters] = useState({});
      const [expandedTypes, setExpandedTypes] = useState({});
      const [selectedItemId, setSelectedItemId] = useState(null);

      // Auth modal state
      const [authModal, setAuthModal] = useState({
        isOpen: false,
        actionTitle: '',
        actionDescription: '',
        onConfirm: null
      });

      const requireAuth = (title, description, onConfirmCallback) => {
        setAuthModal({
          isOpen: true,
          actionTitle: title,
          actionDescription: description,
          onConfirm: () => {
            setAuthModal(prev => ({ ...prev, isOpen: false }));
            if (onConfirmCallback) onConfirmCallback();
          }
        });
      };

      // Load Items
      useEffect(() => {
        const loadData = async () => {
          const sp = getSupabaseClient();
          if (sp) {
            try {
              const { data, error } = await sp.from('items').select('*');
              if (!error && Array.isArray(data) && data.length > 0) {
                setItems(data);
                return;
              }
            } catch(e){}
          }
          try {
            const res = await fetch('/api/data');
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              setItems(data);
              return;
            }
          } catch(e){}
          try {
            const res = await fetch('./data.json');
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              setItems(data);
              return;
            }
          } catch(e){}
          try {
            const local = localStorage.getItem(STORAGE_KEY);
            if (local) setItems(JSON.parse(local));
          } catch(e){}
        };
        loadData();
      }, []);

      // Load Learning Data
      useEffect(() => {
        const loadLearning = async () => {
          const sp = getSupabaseClient();
          if (sp) {
            try {
              const { data, error } = await sp.from('learning').select('*');
              if (!error && Array.isArray(data) && data.length > 0) {
                const map = {};
                data.forEach(row => {
                  const h = row.history || {};
                  map[row.item_id] = {
                    score: row.score || 0,
                    ease_factor: row.ease_factor || 2.5,
                    interval: row.interval || 1,
                    repetition: row.repetition || 0,
                    accepted: Array.isArray(h.accepted) ? h.accepted : (Array.isArray(row.accepted) ? row.accepted : []),
                    rejected: Array.isArray(h.rejected) ? h.rejected : (Array.isArray(row.rejected) ? row.rejected : []),
                    threshold: typeof h.threshold === 'number' ? h.threshold : (typeof row.threshold === 'number' ? row.threshold : 0.75),
                    history: Array.isArray(h.items) ? h.items : (Array.isArray(h) ? h : [])
                  };
                });
                setLearningData(map);
                return;
              }
            } catch(e){}
          }
          try {
            const local = localStorage.getItem('geometria_learning');
            if (local) {
              const parsed = JSON.parse(local);
              if (parsed && typeof parsed === 'object') setLearningData(parsed);
            }
          } catch(e){}
          try {
            const res = await fetch('/api/learning');
            if (res.ok) {
              const data = await res.json();
              if (data && typeof data === 'object') {
                setLearningData(data);
                return;
              }
            }
          } catch(e){}
          try {
            const res = await fetch('./learning.json');
            if (res.ok) {
              const staticData = await res.json();
              if (staticData && typeof staticData === 'object') {
                setLearningData(prev => {
                  const combined = { ...staticData, ...(prev || {}) };
                  saveLearningData(combined);
                  return combined;
                });
              }
            }
          } catch(e){}
        };
        loadLearning();
      }, []);

      const saveLearningData = async (newData) => {
        setLearningData(newData);
        try {
          localStorage.setItem('geometria_learning', JSON.stringify(newData));
        } catch(e){}

        const sp = getSupabaseClient();
        if (sp && newData && typeof newData === 'object') {
          try {
            const rows = Object.entries(newData).map(([itemId, val]) => ({
              item_id: itemId,
              score: val.score || 0,
              ease_factor: val.ease_factor || 2.5,
              interval: val.interval || 1,
              repetition: val.repetition || 0,
              last_reviewed: new Date().toISOString(),
              history: {
                accepted: val.accepted || [],
                rejected: val.rejected || [],
                threshold: typeof val.threshold === 'number' ? val.threshold : 0.75,
                items: val.history || []
              }
            }));
            if (rows.length > 0) {
              await sp.from('learning').upsert(rows);
            }
          } catch(e){}
        }

        fetch('/api/learning', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newData)
        }).catch(() => {});
      };

      const toggleChapter = (ch) => {
        setExpandedChapters(prev => ({ ...prev, [ch]: !prev[ch] }));
      };

      const toggleType = (key) => {
        setExpandedTypes(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const expandAll = () => {
        const chs = {};
        const tps = {};
        CHAPTERS.forEach(ch => {
          chs[ch] = true;
          tps[`${ch}-theorem`] = true;
          tps[`${ch}-definition`] = true;
        });
        setExpandedChapters(chs);
        setExpandedTypes(tps);
      };

      const collapseAll = () => {
        setExpandedChapters({});
        setExpandedTypes({});
      };

      const q = search.toLowerCase().trim();
      const isItemMatch = (it) => {
        if (!q) return true;
        return (it.name && it.name.toLowerCase().includes(q)) ||
               (it.code && it.code.toLowerCase().includes(q)) ||
               (it.chapter && it.chapter.toLowerCase().includes(q)) ||
               (it.content && it.content.toLowerCase().includes(q));
      };

      const getItemLearnedStats = (itemId) => {
        const data = learningData[itemId];
        if (!data) return { accepted: [], rejected: [], total: 0 };
        const accepted = Array.isArray(data.accepted) ? data.accepted : [];
        const rejected = Array.isArray(data.rejected) ? data.rejected : [];
        return { accepted, rejected, total: accepted.length + rejected.length };
      };

      const selectedItem = useMemo(() => {
        return items.find(i => i.id === selectedItemId) || null;
      }, [items, selectedItemId]);

      const selectedItemStats = useMemo(() => {
        if (!selectedItem) return { accepted: [], rejected: [], total: 0, threshold: 0.75 };
        const data = learningData[selectedItem.id] || {};
        return {
          accepted: Array.isArray(data.accepted) ? data.accepted : [],
          rejected: Array.isArray(data.rejected) ? data.rejected : [],
          threshold: typeof data.threshold === 'number' ? data.threshold : 0.75,
          total: (data.accepted?.length || 0) + (data.rejected?.length || 0)
        };
      }, [selectedItem, learningData]);

      const handleDeleteResponse = (type, text) => {
        const typeLabel = type === 'accepted' ? 'risposta accettata' : 'risposta rifiutata';
        const snippet = text.length > 50 ? text.slice(0, 50) + '...' : text;

        const doDelete = () => {
          const current = learningData[selectedItemId] || { accepted: [], rejected: [], threshold: 0.75 };
          const updatedItem = {
            ...current,
            accepted: type === 'accepted' ? (current.accepted || []).filter(t => t !== text) : (current.accepted || []),
            rejected: type === 'rejected' ? (current.rejected || []).filter(t => t !== text) : (current.rejected || [])
          };

          const updated = {
            ...learningData,
            [selectedItemId]: updatedItem
          };

          saveLearningData(updated);
        };

        requireAuth(
          `Eliminazione ${typeLabel}`,
          `"${snippet}" verrà rimossa definitivamente dall'archivio di apprendimento.`,
          doDelete
        );
      };

      const totalAllLearned = useMemo(() => {
        let sum = 0;
        Object.values(learningData || {}).forEach(v => {
          if (v) sum += (v.accepted?.length || 0) + (v.rejected?.length || 0);
        });
        return sum;
      }, [learningData]);

      return (
        <div className="min-h-screen pb-12 text-[#0b192c]">
          {/* HEADER / NAVBAR */}
          <header className="bg-white/90 border-b border-sky-200 sticky top-0 z-40 backdrop-blur-md shadow-sm">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              
              {/* LOGO */}
              <a href="/" className="flex items-center space-x-2">
                <span className="text-2xl font-bold text-sky-500 font-serif leading-none select-none">π</span>
                <h1 className="font-extrabold text-xl text-[#0b192c] tracking-tight">geometria</h1>
              </a>

              <div className="flex items-center space-x-1.5 bg-sky-50/80 p-1 rounded-md border border-sky-200">
                <a
                  href="/"
                  className="px-3 py-1.5 rounded-md text-xs font-bold text-sky-900 hover:bg-sky-100 transition-all"
                >
                  Consultazione
                </a>
                <a
                  href="/test"
                  className="px-3 py-1.5 rounded-md text-xs font-bold text-sky-900 hover:bg-sky-100 transition-all"
                >
                  Area Test
                </a>
                <span className="px-3 py-1.5 rounded-md text-xs font-bold bg-sky-600 text-white shadow-sm flex items-center gap-1.5">
                  <FolderIcon className="w-3.5 h-3.5 text-white" />
                  <span className="hidden sm:inline">Archivio IA</span>
                </span>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 space-y-5">
            {/* TOP HEADER BAR */}
            <div className="flex flex-wrap items-center justify-between gap-4 bg-white border border-sky-200 rounded-xl p-5 shadow-xs">
              <div className="flex items-center gap-3">
                <a
                  href="/test"
                  className="px-3 py-1.5 bg-sky-50 border border-sky-300 text-sky-900 rounded-lg text-xs font-bold hover:bg-sky-100 transition-colors"
                >
                  ← Torna ai Test
                </a>
                <div>
                  <h2 className="text-base font-extrabold text-[#0b192c] flex items-center gap-2">
                    <FolderIcon className="w-5 h-5 text-sky-600 shrink-0" />
                    <span>Archivio Risposte Machine Learning</span>
                  </h2>
                  <p className="text-xs text-sky-800">
                    Naviga l'albero dei capitoli per consultare gli enunciati ufficiali e gestire le risposte apprese dall'IA.
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2 text-xs">
                <span className="px-3.5 py-1.5 rounded-lg bg-sky-100 text-sky-900 font-bold border border-sky-200 shadow-2xs">
                  Totale risposte archiviate: <strong className="font-mono text-sky-700 text-sm">{totalAllLearned}</strong>
                </span>
              </div>
            </div>

            {/* MAIN TWO-COLUMN EXPLORER */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 min-h-[680px]">
              
              {/* LEFT COLUMN: TREE FILE SYSTEM (4 cols) */}
              <div className="lg:col-span-4 bg-white border border-sky-200 rounded-xl p-4 shadow-xs flex flex-col max-h-[750px]">
                
                {/* TREE TOOLBAR */}
                <div className="space-y-2 pb-3 border-b border-sky-100 shrink-0">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-1.5">
                      <FolderIcon className="w-4 h-4 text-sky-600 shrink-0" />
                      <span className="text-xs font-bold text-sky-900 uppercase tracking-wider">File System Capitoli</span>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={expandAll} className="text-[11px] font-bold text-sky-600 hover:underline">Espandi</button>
                      <span className="text-slate-300">•</span>
                      <button onClick={collapseAll} className="text-[11px] font-bold text-slate-500 hover:underline">Comprimi</button>
                    </div>
                  </div>

                  <div className="relative">
                    <input
                      type="text"
                      value={search}
                      onChange={e => setSearch(e.target.value)}
                      placeholder="Filtra per nome o codice..."
                      className="w-full bg-sky-50/50 border border-sky-200 rounded-lg py-1.5 pl-8 pr-2.5 text-xs text-[#0b192c] focus:outline-none focus:border-sky-500 font-medium"
                    />
                    <span className="absolute left-2.5 top-2 text-sky-400 pointer-events-none">
                      <SearchIcon />
                    </span>
                  </div>
                </div>

                {/* TREE NODES (SCROLLABLE) */}
                <div className="overflow-y-auto flex-1 pt-2 space-y-1 pr-1">
                  {CHAPTERS.map(ch => {
                    const chItems = items.filter(it => it.chapter === ch && isItemMatch(it));
                    if (search.trim() && chItems.length === 0) return null;

                    const isExpanded = !!expandedChapters[ch];
                    const theorems = chItems.filter(it => it.type === 'theorem');
                    const definitions = chItems.filter(it => it.type === 'definition');

                    const chLearned = chItems.reduce((acc, it) => {
                      const st = getItemLearnedStats(it.id);
                      return acc + st.total;
                    }, 0);

                    const isTheoExpanded = !!expandedTypes[`${ch}-theorem`];
                    const isDefExpanded = !!expandedTypes[`${ch}-definition`];

                    return (
                      <div key={ch} className="border border-sky-100/80 rounded-lg overflow-hidden text-xs">
                        {/* CHAPTER FOLDER NODE */}
                        <div
                          onClick={() => toggleChapter(ch)}
                          className={`flex items-center justify-between px-3 py-2 cursor-pointer transition-colors select-none ${isExpanded ? 'bg-sky-100/70 text-sky-950 font-bold' : 'bg-sky-50/40 text-sky-900 hover:bg-sky-50 font-semibold'}`}
                        >
                          <div className="flex items-center gap-2 truncate">
                            {isExpanded ? <FolderOpenIcon className="w-4 h-4 text-sky-700" /> : <FolderIcon className="w-4 h-4 text-sky-600" />}
                            <span className="font-mono font-bold text-sky-700">{ch}</span>
                            <span className="truncate">Capitolo {ch}</span>
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0">
                            {chLearned > 0 && (
                              <span className="bg-emerald-100 text-emerald-800 text-[10px] px-1.5 py-0.2 rounded-full font-mono font-bold">
                                {chLearned}
                              </span>
                            )}
                            <span className="text-[10px] text-slate-400">{isExpanded ? '▼' : '▶'}</span>
                          </div>
                        </div>

                        {/* SUB-FOLDERS */}
                        {isExpanded && (
                          <div className="pl-3 py-1 space-y-1 bg-white border-t border-sky-100">
                            {/* TEOREMI FOLDER */}
                            {theorems.length > 0 && (
                              <div>
                                <div
                                  onClick={() => toggleType(`${ch}-theorem`)}
                                  className="flex items-center justify-between px-2 py-1.5 cursor-pointer hover:bg-sky-50 rounded text-sky-900 select-none font-medium"
                                >
                                  <div className="flex items-center gap-1.5">
                                    {isTheoExpanded ? <FolderOpenIcon className="w-3.5 h-3.5 text-sky-700" /> : <FolderIcon className="w-3.5 h-3.5 text-sky-600" />}
                                    <span className="font-bold">Teoremi</span>
                                    <span className="text-[10px] text-slate-400">({theorems.length})</span>
                                  </div>
                                  <span className="text-[9px] text-slate-400">{isTheoExpanded ? '▼' : '▶'}</span>
                                </div>

                                {isTheoExpanded && (
                                  <div className="pl-4 space-y-0.5 mt-0.5 border-l-2 border-sky-200 ml-3">
                                    {theorems.map(it => {
                                      const st = getItemLearnedStats(it.id);
                                      const isSel = selectedItemId === it.id;
                                      return (
                                        <div
                                          key={it.id}
                                          onClick={() => setSelectedItemId(it.id)}
                                          className={`px-2 py-1.5 rounded-md cursor-pointer transition-all flex items-center justify-between gap-1.5 ${isSel ? 'bg-sky-600 text-white font-bold shadow-xs' : 'hover:bg-sky-100 text-[#0b192c]'}`}
                                        >
                                          <span className="truncate">{it.name}</span>
                                          {st.total > 0 && (
                                            <span className={`text-[9px] font-mono px-1 rounded shrink-0 ${isSel ? 'bg-sky-800 text-white' : 'bg-sky-100 text-sky-800 font-bold'}`}>
                                              {st.accepted.length > 0 ? `+${st.accepted.length} ` : ''}{st.rejected.length > 0 ? `-${st.rejected.length}` : ''}
                                            </span>
                                          )}
                                        </div>
                                      );
                                    })}
                                  </div>
                                )}
                              </div>
                            )}

                            {/* DEFINIZIONI FOLDER */}
                            {definitions.length > 0 && (
                              <div>
                                <div
                                  onClick={() => toggleType(`${ch}-definition`)}
                                  className="flex items-center justify-between px-2 py-1.5 cursor-pointer hover:bg-sky-50 rounded text-sky-900 select-none font-medium"
                                >
                                  <div className="flex items-center gap-1.5">
                                    {isDefExpanded ? <FolderOpenIcon className="w-3.5 h-3.5 text-sky-700" /> : <FolderIcon className="w-3.5 h-3.5 text-sky-600" />}
                                    <span className="font-bold">Definizioni</span>
                                    <span className="text-[10px] text-slate-400">({definitions.length})</span>
                                  </div>
                                  <span className="text-[9px] text-slate-400">{isDefExpanded ? '▼' : '▶'}</span>
                                </div>

                                {isDefExpanded && (
                                  <div className="pl-4 space-y-0.5 mt-0.5 border-l-2 border-sky-200 ml-3">
                                    {definitions.map(it => {
                                      const st = getItemLearnedStats(it.id);
                                      const isSel = selectedItemId === it.id;
                                      return (
                                        <div
                                          key={it.id}
                                          onClick={() => setSelectedItemId(it.id)}
                                          className={`px-2 py-1.5 rounded-md cursor-pointer transition-all flex items-center justify-between gap-1.5 ${isSel ? 'bg-sky-600 text-white font-bold shadow-xs' : 'hover:bg-sky-100 text-[#0b192c]'}`}
                                        >
                                          <span className="truncate">{it.name}</span>
                                          {st.total > 0 && (
                                            <span className={`text-[9px] font-mono px-1 rounded shrink-0 ${isSel ? 'bg-sky-800 text-white' : 'bg-sky-100 text-sky-800 font-bold'}`}>
                                              {st.accepted.length > 0 ? `+${st.accepted.length} ` : ''}{st.rejected.length > 0 ? `-${st.rejected.length}` : ''}
                                            </span>
                                          )}
                                        </div>
                                      );
                                    })}
                                  </div>
                                )}
                              </div>
                            )}

                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* RIGHT COLUMN: DETAILS & LEARNED RESPONSES (8 cols) */}
              <div className="lg:col-span-8 bg-white border border-sky-200 rounded-xl p-6 shadow-xs flex flex-col max-h-[750px] overflow-y-auto">
                {!selectedItem ? (
                  <div className="m-auto text-center py-16 space-y-3">
                    <div className="w-14 h-14 mx-auto rounded-full bg-sky-50 border border-sky-200 flex items-center justify-center">
                      <FolderIcon className="w-7 h-7 text-sky-500" />
                    </div>
                    <h3 className="text-base font-black text-[#0b192c]">Nessun elemento selezionato</h3>
                    <p className="text-xs text-sky-800 max-w-md mx-auto">
                      Clicca su un teorema o su una definizione dall'albero a sinistra per visualizzare l'enunciato ufficiale e tutte le risposte memorizzate dall'IA.
                    </p>
                  </div>
                ) : (
                  <div className="space-y-6">
                    {/* ITEM HEADER */}
                    <div className="border-b border-sky-100 pb-4 space-y-2">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="px-2 py-0.5 rounded bg-sky-900 text-white font-mono font-bold text-xs">
                          {selectedItem.chapter}
                        </span>
                        <span className={`px-2 py-0.5 rounded text-[11px] font-extrabold uppercase ${selectedItem.type === 'theorem' ? 'bg-sky-200 text-sky-900 border border-sky-300' : 'bg-blue-100 text-blue-900 border border-blue-200'}`}>
                          {selectedItem.type === 'theorem' ? 'Teorema' : 'Definizione'}
                        </span>
                        <span className="px-2 py-0.5 rounded bg-sky-100 border border-sky-300 text-sky-900 font-mono font-bold text-xs">
                          {selectedItem.code}
                        </span>
                      </div>

                      <h2 className="text-xl font-black text-[#0b192c] tracking-tight">
                        {selectedItem.name}
                      </h2>

                      {/* METRICS ROW */}
                      <div className="flex items-center gap-4 pt-1 text-xs text-sky-800">
                        <span>Tolleranza IA: <strong>{Math.round(selectedItemStats.threshold * 100)}%</strong></span>
                        <span>•</span>
                        <span>Risposte apprese: <strong className="text-emerald-700">{selectedItemStats.accepted.length} corrette</strong> / <strong className="text-rose-700">{selectedItemStats.rejected.length} errate</strong></span>
                      </div>
                    </div>

                    {/* OFFICIAL DEFINITION / ENUNCIATO */}
                    <div className="bg-sky-50/80 border border-sky-200 rounded-lg p-4 space-y-1">
                      <h4 className="text-xs font-bold text-sky-950 uppercase tracking-wider">
                        {selectedItem.type === 'theorem' ? 'Enunciato Ufficiale' : 'Definizione Ufficiale'}
                      </h4>
                      <MathRender content={selectedItem.content} className="text-[#0b192c] text-xs leading-relaxed" />
                    </div>

                    {/* SECTION 1: ACCEPTED RESPONSES */}
                    <div className="space-y-3">
                      <div className="flex items-center justify-between border-b border-emerald-200 pb-2">
                        <h3 className="text-xs font-extrabold text-emerald-900 uppercase tracking-wide flex items-center gap-2">
                          <CheckCircleIcon className="w-4 h-4 text-emerald-600" />
                          <span>Formulazioni Accettate dall'IA ({selectedItemStats.accepted.length})</span>
                        </h3>
                        <span className="text-[11px] text-emerald-700 font-medium">Considerate corrette durante i test</span>
                      </div>

                      {selectedItemStats.accepted.length === 0 ? (
                        <div className="p-4 bg-emerald-50/40 border border-emerald-200 rounded-lg text-xs text-emerald-800 italic text-center">
                          Nessuna formulazione alternativa accettata ancora registrata per questo oggetto.
                        </div>
                      ) : (
                        <div className="space-y-2">
                          {selectedItemStats.accepted.map((ans, idx) => (
                            <div
                              key={idx}
                              className="bg-white border border-emerald-200 rounded-lg p-3.5 flex items-start justify-between gap-3 shadow-2xs hover:border-emerald-300 transition-colors"
                            >
                              <div className="space-y-1 flex-1">
                                <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800">
                                  Variante #{idx + 1}
                                </span>
                                <p className="text-xs text-[#0b192c] whitespace-pre-wrap leading-relaxed">
                                  {ans}
                                </p>
                              </div>
                              <button
                                onClick={() => handleDeleteResponse('accepted', ans)}
                                title="Elimina definitivamente questa risposta (richiede codice)"
                                className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-md transition-colors text-xs font-bold shrink-0"
                              >
                                <TrashIcon />
                              </button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* SECTION 2: REJECTED RESPONSES */}
                    <div className="space-y-3 pt-2">
                      <div className="flex items-center justify-between border-b border-rose-200 pb-2">
                        <h3 className="text-xs font-extrabold text-rose-900 uppercase tracking-wide flex items-center gap-2">
                          <XCircleIcon className="w-4 h-4 text-rose-600" />
                          <span>Formulazioni Rifiutate dall'IA ({selectedItemStats.rejected.length})</span>
                        </h3>
                        <span className="text-[11px] text-rose-700 font-medium">Considerate errate durante i test</span>
                      </div>

                      {selectedItemStats.rejected.length === 0 ? (
                        <div className="p-4 bg-rose-50/40 border border-rose-200 rounded-lg text-xs text-rose-800 italic text-center">
                          Nessuna risposta rifiutata registrata per questo oggetto.
                        </div>
                      ) : (
                        <div className="space-y-2">
                          {selectedItemStats.rejected.map((ans, idx) => (
                            <div
                              key={idx}
                              className="bg-white border border-rose-200 rounded-lg p-3.5 flex items-start justify-between gap-3 shadow-2xs hover:border-rose-300 transition-colors"
                            >
                              <div className="space-y-1 flex-1">
                                <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-rose-100 text-rose-800">
                                  Errore memorizzato #{idx + 1}
                                </span>
                                <p className="text-xs text-[#0b192c] whitespace-pre-wrap leading-relaxed">
                                  {ans}
                                </p>
                              </div>
                              <button
                                onClick={() => handleDeleteResponse('rejected', ans)}
                                title="Elimina definitivamente questa risposta (richiede codice)"
                                className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-md transition-colors text-xs font-bold shrink-0"
                              >
                                <TrashIcon />
                              </button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                  </div>
                )}
              </div>

            </div>
          </main>

          <AuthConfirmModal
            isOpen={authModal.isOpen}
            onClose={() => setAuthModal(prev => ({ ...prev, isOpen: false }))}
            onConfirm={authModal.onConfirm}
            actionTitle={authModal.actionTitle}
            actionDescription={authModal.actionDescription}
          />

          <GlobalFooter />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MachineLearningApp />);
  </script>
</body>
</html>
